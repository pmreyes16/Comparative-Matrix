<body class="bg-slate-100 text-slate-800">
<div id="root" class="min-h-screen"></div>
<!-- ============================================================= -->
<!-- 1) PURE LOGIC  (money, schema, parsers, extraction, logos)     -->
<!--    Exposed on window.CMP so the React layer can consume it.    -->
<!-- ============================================================= -->
<script>
(function () {
  const CMP = {};

  /* ---------------------------------------------------------------
   * MONEY  — single shared money helper used for EVERY monetary field
   * (premium line items, premium total, sum insured, deductibles).
   *
   * CRITICAL: we NEVER store a monetary value in a JS number for display.
   * The exact source substring (incl. trailing zeros like "500,000.00")
   * is preserved verbatim in `amountDisplay`. The numeric `amount` is
   * derived ONLY for sorting / range filtering and is never rendered.
   * This is the guard against the "native number input strips .00" bug.
   * ------------------------------------------------------------- */
  const CURRENCIES = [
    { code: 'PHP', symbol: '₱', rx: /₱|\bphp\b|\bpeso/i },
    { code: 'USD', symbol: '$', rx: /\bus\$|\busd\b/i },
    { code: 'EUR', symbol: '€', rx: /€|\beur\b/i },
    { code: 'GBP', symbol: '£', rx: /£|\bgbp\b/i },
    { code: 'JPY', symbol: '¥', rx: /¥|\bjpy\b/i },
  ];

  function detectCurrency(s) {
    for (const c of CURRENCIES) if (c.rx.test(s)) return c;
    // bare "$" already handled by USD; default to PHP for this market
    if (/\$/.test(s)) return CURRENCIES[1];
    return CURRENCIES[0]; // PHP default (Philippine market)
  }

  // Parse ONE amount out of a free-text value. Returns null if no number found.
  function parseMoney(raw) {
    if (raw == null) return null;
    const s = String(raw).trim();
    if (!s) return null;
    // capture digits with optional thousands separators and optional decimals,
    // preserving the exact written form (including trailing zeros).
    const m = s.match(/(?:₱|php|us\$|usd|eur|gbp|jpy|\$|€|£|¥)?\s*([0-9]{1,3}(?:,[0-9]{3})+(?:\.[0-9]+)?|[0-9]+(?:\.[0-9]+)?)/i);
    if (!m) return null;
    const display = m[1];                      // e.g. "24,580.00" — verbatim
    const numeric = Number(display.replace(/,/g, ''));
    const cur = detectCurrency(s);
    return {
      amountDisplay: display,
      amount: Number.isFinite(numeric) ? numeric : null,
      currency: cur.code,
      symbol: cur.symbol,
    };
  }

  // Render a money object EXACTLY as captured. Falls back to a manual-verify flag.
  function formatMoney(mo) {
    if (!mo || !mo.amountDisplay) return 'Not detected — verify manually';
    return (mo.symbol || '') + ' ' + mo.amountDisplay;
  }

  CMP.parseMoney = parseMoney;
  CMP.formatMoney = formatMoney;

  // Sectioned money (Sum Insured / Deductibles with Section I, II, …).
  CMP.sectionsOf = function (field) {
    if (!field) return [];
    if (Array.isArray(field.sections)) return field.sections;
    if (field.amountDisplay) return [{ label: '', money: field }];
    return [];
  };
  CMP.primaryMoney = function (field) {
    const s = CMP.sectionsOf(field).find((x) => x.money && x.money.amountDisplay);
    return s ? s.money : null;
  };
  CMP.primaryAmount = function (field) {
    const m = CMP.primaryMoney(field);
    return m ? m.amount : null;
  };
  CMP.sectionValue = function (sec) {
    if (!sec) return '';
    if (sec.money && sec.money.amountDisplay) return formatMoney(sec.money);
    return sec.value != null ? String(sec.value) : '';
  };
  CMP.formatSections = function (field) {
    const secs = CMP.sectionsOf(field).filter((x) => CMP.sectionValue(x));
    if (!secs.length) return '';
    if (secs.length === 1 && !secs[0].label) return CMP.sectionValue(secs[0]);
    return secs.map((x) => (x.label ? x.label + ': ' : '') + CMP.sectionValue(x)).join('\n');
  };

  // Total Premium aligned with the Matrix (manual override if set, else extracted).
  CMP.premiumTotalDisplay = function (p) {
    const o = p && p.overrides && p.overrides.premiumTotal;
    if (o != null && String(o).trim() !== '') return String(o);
    return p && p.premium && p.premium.total ? formatMoney(p.premium.total.money) : '';
  };
  CMP.premiumTotalAmount = function (p) {
    const o = p && p.overrides && p.overrides.premiumTotal;
    if (o != null && String(o).trim() !== '') { const m = String(o).replace(/,/g, '').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; }
    return p && p.premium && p.premium.total ? p.premium.total.money.amount : null;
  };
  // Normalise a hand-typed money value to "<symbol> 1,234,567.89" (comma + cents).
  // Only reformats plain numbers; text with extra words is left as typed. Idempotent.
  CMP.formatMoneyInput = function (text) {
    const s = String(text == null ? '' : text).trim();
    if (!s) return '';
    const sym = (s.match(/[₱$€£¥]/) || [''])[0];
    const core = s.replace(/[₱$€£¥,\s]/g, '');
    if (/^-?\d+(\.\d+)?$/.test(core)) {
      const n = parseFloat(core);
      if (isFinite(n)) return (sym || '₱') + ' ' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    return s;
  };
  // Reformat only the money AMOUNTS inside mixed text (Sum Insured / Deductibles),
  // leaving section labels, percentages ("2%") and time excesses ("72 hours") intact.
  CMP.formatMoneyInText = function (text) {
    const s = String(text == null ? '' : text);
    if (!s) return '';
    const re = /([₱$€£¥]\s*)?(\d[\d,]*(?:\.\d+)?)/g;
    return s.replace(re, function (m, sym, num, offset, full) {
      const after = full.slice(offset + m.length);
      if (/^\s*%/.test(after)) return m;
      if (/^\s*(hours?|hrs?|days?|months?|mos?|weeks?|wks?|years?|yrs?)\b/i.test(after)) return m;
      const core = num.replace(/,/g, '');
      const hasComma = num.indexOf(',') >= 0;
      const hasDot = num.indexOf('.') >= 0;
      const intDigits = core.split('.')[0].length;
      const yearLike = !sym && !hasComma && !hasDot && /^(19|20)\d{2}$/.test(core);
      const isMoney = !!sym || hasComma || hasDot || (intDigits >= 4 && !yearLike);
      if (!isMoney) return m;
      const n = parseFloat(core);
      if (!isFinite(n)) return m;
      return (sym ? sym.trim() + ' ' : '') + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    });
  };

  /* ---------------------------------------------------------------
   * SCHEMA — an empty proposal, mirroring the source slip field names.
   * ------------------------------------------------------------- */
  function emptyProposal(fileName) {
    return {
      id: 'p_' + Math.random().toString(36).slice(2, 9),
      fileName: fileName || '',
      insurers: [],                 // [{ name, logoUrl, percentageShare }]
      policyType: '',
      insured: '',
      natureOfBusiness: '',
      project: '',
      periodOfInsurance: { from: '', to: '' },
      locationsOfRisks: '',
      cover: '',
      sumInsured: { sections: [
        { label: 'Section I – Material Damage', money: null },
        { label: 'Section II – Third Party Liability', money: null },
      ] },
      deductibles: { sections: [
        { label: 'Section I – Material Damage', value: '' },
        { label: 'Section II – Third Party Liability', value: '' },
      ] },
      clausesAndWarranties: [],     // string[]
      premiumRate: { sections: [
        { label: 'Section I – Material Damage', value: '' },
        { label: 'Section II – Third Party Liability', value: 'free of charge' },
      ] },
      brokerageRate: '',
      premium: { lineItems: [], total: null, currency: 'PHP' }, // lineItems: [{label, money}]
      premiumPaymentTerms: '',
      birReference: '',
      leadInsurerClause: '',
      severalLiabilityClause: '',
      claimsInformation: '',
      choiceOfJurisdiction: '',
      policyForm: '',
      validityOfQuote: '',
      extractionConfidence: 'low',  // high | medium | low
      flaggedFields: [],
      overrides: {},                // per-field manual edits made in the Matrix
      rawText: '',
    };
  }
  CMP.emptyProposal = emptyProposal;

  /* ---------------------------------------------------------------
   * PARSERS — turn an uploaded file into { text, pairs, images }.
   *   pairs = [{label, value}] recovered from table rows (most reliable)
   *   text  = newline-joined lines (fallback for regex)
   *   images = data-URI candidates for logo auto-extraction (docx only)
   * ------------------------------------------------------------- */

  // Convert loose text lines into label/value pairs when a "Label: value"
  // shape is present. Table-derived pairs are added separately and trusted more.
  function linesToPairs(lines) {
    const pairs = [];
    for (const line of lines) {
      const colon = line.match(/^([A-Za-z][A-Za-z0-9 /&'().\-]{2,60}?)\s*[:\-–]\s+(.+)$/);
      if (colon) pairs.push({ label: colon[1].trim(), value: colon[2].trim(), soft: true });
    }
    return pairs;
  }

  // True when a line is page chrome (header / footer / classification banner /
  // reference code / reviewer initials) rather than slip content.
  function isBoilerplateLine(s) {
    const t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
    if (!t) return true;
    if (/\d\s*\|\s*p\s*a?\s*g\s*e\b/i.test(t)) return true;
    if (/\bpage\s*\d+\s*(?:of|\/)\s*\d+\b/i.test(t)) return true;
    if (/^page\b/i.test(t) && t.length < 12) return true;
    if (/\blevel\s*\d+\s*\(?\s*(restricted|confidential|internal)/i.test(t)) return true;
    if (/^(?:private\s*&?\s*)?(?:strictly\s*)?(?:confidential|restricted)\b/i.test(t) && t.length < 40) return true;
    if (/\bR\d{2}\b\s*$/i.test(t) && /(?:19|20)\d{2}/.test(t) && t.length < 60) return true;
    if (/^(?:[A-Za-z]\s+){1,5}[A-Za-z](?:\s*\|\s*(?:[A-Za-z]\s+)*[A-Za-z]\s*)+$/.test(t)) return true;
    return false;
  }

  async function extractPdf(file) {
    const buf = await file.arrayBuffer();
    const __d = new Uint8Array(buf);
    const pdf = window.__unpdfGetDocument ? await window.__unpdfGetDocument(__d) : await window.pdfjsLib.getDocument({ data: __d }).promise;
    const norm4 = (r) => [Math.min(r[0], r[2]), Math.min(r[1], r[3]), Math.max(r[0], r[2]), Math.max(r[1], r[3])];
    const pageLineArrays = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const strikeRects = [];
      const markupLines = [];
      try {
        const annots = await page.getAnnotations();
        annots.forEach((a) => {
          if (a.subtype === 'StrikeOut' && a.rect) strikeRects.push(norm4(a.rect));
          let t = a.fieldValue != null && a.fieldValue !== '' ? String(a.fieldValue) : (a.contents ? String(a.contents) : '');
          t = t.replace(/\s+/g, ' ').trim();
          if (t) markupLines.push(t);
        });
      } catch (e) { /* ignore */ }
      const inStrike = (x, y) => strikeRects.some((r) => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3]);
      const rows = {};
      tc.items.forEach((it) => {
        if (!it.str || !it.str.trim()) return;
        const x = it.transform[4], y = it.transform[5];
        if (inStrike(x, y)) return;
        const yk = Math.round(y);
        (rows[yk] = rows[yk] || []).push({ x, s: it.str });
      });
      const pageLines = [];
      Object.keys(rows).map(Number).sort((a, b) => b - a).forEach((yk) => {
        const line = rows[yk].sort((a, b) => a.x - b.x).map((o) => o.s).join(' ').replace(/\s+/g, ' ').trim();
        if (line) pageLines.push(line);
      });
      markupLines.forEach((t) => { if (!pageLines.includes(t)) pageLines.push(t); });
      pageLineArrays.push(pageLines);
    }
    const nrm = (s) => s.toLowerCase().replace(/\s+/g, ' ').trim();
    const freq = {};
    pageLineArrays.forEach((pl) => { const seen = new Set(); pl.forEach((l) => { const k = nrm(l); if (!seen.has(k)) { seen.add(k); freq[k] = (freq[k] || 0) + 1; } }); });
    const multi = pdf.numPages >= 2;
    const lines = [];
    pageLineArrays.forEach((pl) => pl.forEach((l) => {
      if (isBoilerplateLine(l)) return;
      if (multi && freq[nrm(l)] >= 2) return; // running header / footer
      lines.push(l);
    }));
    return { text: lines.join('\n'), pairs: linesToPairs(lines), images: [] };
  }

  async function extractXlsx(file) {
    const buf = await file.arrayBuffer();
    const wb = window.XLSX.read(buf, { type: 'array' });
    const pairs = [], lines = [];
    wb.SheetNames.forEach((name) => {
      const ws = wb.Sheets[name];
      const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
      rows.forEach((r) => {
        const cells = r.map((c) => String(c == null ? '' : c).trim());
        const nonEmpty = cells.filter(Boolean);
        if (nonEmpty.length) lines.push(nonEmpty.join(' | '));
        if (cells.length >= 2 && cells[0]) {
          const val = cells.slice(1).filter(Boolean).join(' ');
          if (val) pairs.push({ label: cells[0], value: val });
        }
      });
    });
    const clean = lines.filter((l) => !isBoilerplateLine(l));
    return { text: clean.join('\n'), pairs: pairs.filter((p) => !isBoilerplateLine(p.value)), images: [] };
  }

  async function extractDocx(file) {
    const buf = await file.arrayBuffer();
    const images = [];
    const res = await window.mammoth.convertToHtml({ arrayBuffer: buf }, {
      styleMap: ['strike => s'],
      convertImage: window.mammoth.images.imgElement(async (img) => {
        try {
          const b64 = await img.read('base64');
          const src = 'data:' + img.contentType + ';base64,' + b64;
          images.push(src);
          return { src };
        } catch (e) { return {}; }
      }),
    });
    const doc = new DOMParser().parseFromString(res.value, 'text/html');
    // Remove crossed-out / deleted text so it is not read.
    doc.querySelectorAll('s, strike, del').forEach((el) => el.remove());
    const pairs = [], lines = [];
    doc.querySelectorAll('table tr').forEach((tr) => {
      const tds = [...tr.querySelectorAll('td,th')].map((td) => td.textContent.trim());
      const nonEmpty = tds.filter(Boolean);
      if (nonEmpty.length) lines.push(nonEmpty.join(' | '));
      if (tds.length >= 2 && tds[0]) {
        const val = tds.slice(1).filter(Boolean).join(' ');
        if (val) pairs.push({ label: tds[0], value: val });
      }
    });
    doc.querySelectorAll('p,li,h1,h2,h3,h4').forEach((el) => {
      const t = el.textContent.trim();
      if (t) lines.push(t);
    });
    const clean = lines.filter((l) => !isBoilerplateLine(l));
    return { text: clean.join('\n'), pairs: pairs.concat(linesToPairs(clean)).filter((p) => !isBoilerplateLine(p.value)), images };
  }

  async function parseFile(file) {
    const name = (file.name || '').toLowerCase();
    if (name.endsWith('.pdf')) return extractPdf(file);
    if (name.endsWith('.xlsx') || name.endsWith('.xls')) return extractXlsx(file);
    if (name.endsWith('.docx')) return extractDocx(file);
    if (name.endsWith('.doc')) {
      throw new Error('Legacy .doc is not supported in-browser — please re-save as .docx');
    }
    throw new Error('Unsupported file type');
  }
  CMP.parseFile = parseFile;

  /* ---------------------------------------------------------------
   * EXTRACTION — heuristic mapping of {text, pairs} -> proposal schema.
   * Deliberately conservative: it never fabricates a value. Anything
   * recovered from loose text (not a clean table row) is flagged for
   * manual verification.
   * ------------------------------------------------------------- */
  const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9 %]/g, ' ').replace(/\s+/g, ' ').trim();

  const FIELD_LABELS = {
    policyType: ['policy type', 'class of insurance', 'type of policy', 'line of business', 'class'],
    insured: ['name of insured', 'insured', 'assured', 'policyholder', 'name of assured'],
    natureOfBusiness: ['nature of business', 'business', 'occupation', 'trade'],
    project: ['project', 'vehicle', 'unit', 'subject matter', 'make and model', 'description of unit'],
    locationsOfRisks: ['locations of risk', 'location of risk', 'risk location', 'garaging address', 'location'],
    cover: ['scope of cover', 'cover', 'coverage', 'perils covered', 'perils insured'],
    sumInsured: ['total sum insured', 'sum insured', 'insured value', 'amount insured', 'tsi'],
    deductibles: ['deductibles', 'deductible', 'excess', 'franchise'],
    premiumRate: ['premium rate', 'rate'],
    brokerageRate: ['brokerage rate', 'brokerage', 'commission'],
    premiumPaymentTerms: ['premium payment terms', 'payment terms', 'terms of payment', 'mode of payment'],
    birReference: ['bir revenue', 'revenue memorandum order', 'revenue regulation', 'rmo', 'bir'],
    leadInsurerClause: ['lead insurer clause', 'lead insurer', 'lead underwriter'],
    severalLiabilityClause: ['several liability clause', 'several liability'],
    claimsInformation: ['claims information', 'claims experience', 'loss record', 'claims history', 'claims'],
    choiceOfJurisdiction: ['choice of jurisdiction', 'jurisdiction', 'law and practice', 'governing law', 'choice of jurisdiction, law and practice'],
    policyForm: ['policy form', 'policy wording', 'wording', 'form'],
    validityOfQuote: ['validity of quote', 'validity of quotation', 'quotation valid', 'quote valid', 'valid until', 'validity'],
    insurerName: ['insurer', 'insurance company', 'underwriter', 'company', 'insurer / percentage share', 'security'],
    natureBusinessAlt: ['nature of business'],
    period: ['period of insurance', 'policy period', 'period'],
  };

  // Find the best value for a set of candidate labels. Prefers table pairs.
  function findField(candidates, pairs) {
    // table (hard) pairs first, then soft (colon) pairs
    const hard = pairs.filter((p) => !p.soft);
    const soft = pairs.filter((p) => p.soft);
    for (const group of [hard, soft]) {
      for (const cand of candidates) {
        const nc = norm(cand);
        for (const p of group) {
          const nl = norm(p.label);
          if (nl === nc || nl.startsWith(nc + ' ') || nl === nc + 's') {
            if (p.value && norm(p.value)) return { value: p.value.trim(), soft: !!p.soft };
          }
        }
      }
    }
    return null;
  }

  // Premium is special: gather every recognised charge line + a total.
  const PREMIUM_ITEM_LABELS = [
    'basic premium', 'premium', 'documentary stamp tax', 'doc stamp tax', 'doc stamp',
    'dst', 'value added tax', 'v.a.t', 'vat', 'local government tax', 'lgt',
    'fire service tax', 'fst', "broker's fee", 'brokers fee', 'broker fee',
  ];
  const PREMIUM_TOTAL_LABELS = [
    'net premium due', 'total premium due', 'total premium', 'gross premium',
    'net premium', 'amount due', 'premium due', 'total amount due', 'total',
  ];
  const PREMIUM_EXCLUDE = ['premium rate', 'premium payment terms', 'premium payment', 'rate'];

  function extractPremium(pairs) {
    const items = [];
    let total = null;
    let currency = 'PHP';
    const seen = new Set();
    for (const p of pairs) {
      const nl = norm(p.label);
      if (!nl) continue;
      if (PREMIUM_EXCLUDE.some((x) => nl === norm(x) || nl.startsWith(norm(x) + ' '))) continue;

      const isTotal = PREMIUM_TOTAL_LABELS.some((x) => nl === norm(x) || nl.startsWith(norm(x) + ' '));
      const isItem = PREMIUM_ITEM_LABELS.some((x) => nl === norm(x) || nl.startsWith(norm(x) + ' '));
      if (!isTotal && !isItem) continue;

      const money = parseMoney(p.value);
      if (!money) continue;
      if (money.currency) currency = money.currency;

      if (isTotal && !total) {
        total = { label: p.label.trim(), money };
      } else if (isItem) {
        const key = nl + '|' + money.amountDisplay;
        if (seen.has(key)) continue;
        seen.add(key);
        items.push({ label: p.label.trim(), money, nl });
      }
    }

    // Standard Applicable Premium Charges template, overlaying detected amounts.
    const STD = [
      { label: 'Basic Premium', keys: ['basic premium', 'premium'] },
      { label: 'Documentary Stamps Tax (DST)', keys: ['documentary', 'doc stamp', 'dst'] },
      { label: 'Value Added Tax (VAT)', keys: ['value added', 'vat'] },
      { label: 'Local Government Tax (LGT)', keys: ['local government', 'lgt'] },
    ];
    const matched = new Set();
    const lineItems = STD.map((row) => {
      const hit = items.find((d) => row.keys.some((k) => d.nl.includes(norm(k))));
      if (hit) matched.add(hit);
      let m = hit ? hit.money : null;
      if (!m && row.label.includes('VAT')) m = { amountDisplay: '- EXEMPTED -', amount: null, currency: 'PHP', symbol: '' };
      return { label: row.label, money: m };
    });
    items.forEach((d) => { if (!matched.has(d)) lineItems.push({ label: d.label, money: d.money }); });

    return { lineItems, total, currency };
  }

  // Insurer keyword list (editable): descriptors + known carrier brand tokens
  // (PH non-life market + major international carriers). Add your own carriers
  // to INSURER_BRANDS so bare "<name> – NN%" lines are recognised.
  const INSURER_DESCRIPTOR = /insur|assur|underwrit|reinsur|surety|mutual|takaful|lloyd|syndicate|indemnity|casualty|guarant|provident|fidelity|holdings|\bgroup\b|\bco\.?\b|\bcorp\.?\b|\bcompany\b|\bcompanies\b|\bltd\.?\b|\binc\.?\b|\bplc\b|\bpte\b|\bbhd\b|berhad|\bre\b|\bs\.?a\.?\b|\bn\.?v\.?\b|\ba\.?g\.?\b|\bse\b/i;
  const INSURER_BRANDS = [
    'malayan', 'pioneer', 'sterling', 'stronghold', 'prudential', 'prudentialife', 'cocolife',
    'mercantile', 'fpg', 'cibeles', 'ucpb', 'plaridel', 'paramount', 'milestone', 'charter',
    'ping an', 'etiqa', 'insular', 'visayan', 'iloilo', 'carguard', 'areza', 'bethel', 'phoenix',
    'oriental', 'pacific cross', 'intra strata', 'pga', 'bpi', 'standard insurance',
    'phil british', 'philippine british', 'malayan insurance',
    'qbe', 'aig', 'chubb', 'allianz', 'axa', 'zurich', 'munich', 'swiss re', 'tokio', 'msig',
    'sompo', 'generali', 'aviva', 'mapfre', 'berkshire', 'markel', 'hiscox', 'beazley', 'scor',
    'everest', 'hdi', 'talanx',
  ];
  const INSURER_BRAND_RX = new RegExp('\\b(' + INSURER_BRANDS.join('|') + ')\\b', 'i');

  // True when a string reads like an insurer's legal name / known brand, not a clause fragment.
  function looksLikeInsurer(name) {
    return INSURER_DESCRIPTOR.test(name) || INSURER_BRAND_RX.test(name);
  }

  // Last-resort insurer name derived from the file name.
  function insurerFromFileName(fileName) {
    if (!fileName) return '';
    let s = fileName.replace(/\.[a-z0-9]+$/i, '').replace(/[_\-]+/g, ' ');
    s = s.replace(/\b(quotation|quote|proposal|slip|comparative|matrix|final|draft|copy|rev\d*|r\d+|v\d+)\b/gi, ' ');
    s = s.replace(/\s+/g, ' ').trim();
    return s.length >= 3 ? s : '';
  }

  // Co-insurance: "ABC Insurance Co. — 60%" style rows. A "…NN%" line is only
  // treated as an insurer when the name actually reads like one — otherwise the
  // parser would grab clause fragments. Falls back to an explicit "Insurer"
  // field, then to the file name.
  function extractInsurers(pairs, text, fileName) {
    const insurers = [];
    const shareRx = /([A-Za-z][A-Za-z0-9 .,&'()\-]{2,80}?)\s*[-–—:]?\s*(\d{1,3}(?:\.\d+)?)\s*%/g;
    let m;
    while ((m = shareRx.exec(text)) !== null) {
      const name = m[1].replace(/\s+/g, ' ').trim();
      const share = m[2] + '%';
      if (/premium|brokerage|rate|tax|vat|discount|loading|deductible|excess|share|aggregate|limit|\bloi\b/i.test(name)) continue;
      if (name.length < 3 || !looksLikeInsurer(name)) continue;
      if (!insurers.some((i) => norm(i.name) === norm(name))) {
        insurers.push({ name, percentageShare: share, logoUrl: '' });
      }
    }
    if (insurers.length) return insurers;

    // fallback 1: an explicit "Insurer" / "Insurance Company" field
    const single = findField(FIELD_LABELS.insurerName, pairs);
    if (single && single.value && !/%/.test(single.value)) {
      const nm = single.value.replace(/\s+/g, ' ').trim();
      if (nm && !/^insurer\b/i.test(nm) && !/percentage share/i.test(nm)) {
        return [{ name: nm, percentageShare: '', logoUrl: '' }];
      }
    }

    // fallback 2: derive from the file name
    const fromFile = insurerFromFileName(fileName);
    if (fromFile) return [{ name: fromFile, percentageShare: '', logoUrl: '' }];

    return [];
  }

  function extractPeriod(pairs) {
    const raw = findField(FIELD_LABELS.period, pairs);
    if (!raw) return { from: '', to: '' };
    const v = raw.value;
    // split on "to", "–", "-", "until"
    const parts = v.split(/\s+(?:to|until|thru|through|–|—)\s+|\s*-\s*(?=\d)/i);
    if (parts.length >= 2) return { from: parts[0].trim(), to: parts.slice(1).join(' ').trim() };
    return { from: v.trim(), to: '' };
  }

  const NEXT_SECTION_RX = /\n\s*(premium\s+rate|applicable\s+premium|brokerage\s+rate|premium\s+payment|bir\b|revenue\s+memorandum|revenue\s+regulation|insurer\s*\/|percentage\s+share|lead\s+insurer|several\s+liability|claims\s+information|choice\s+of\s+jurisdiction|policy\s+form|validity\s+of\s+quote)/i;

  // Capture the FULL Clauses & Warranties list — every wording, no caps.
  function extractClauses(pairs, text) {
    let src = '';
    const hit = findField(['clauses and warranties', 'clauses & warranties', 'clauses', 'warranties'], pairs);
    if (hit && hit.value) src = hit.value;
    const m = (text || '').match(/clauses\s*(?:&|and)?\s*warranties/i);
    if (m) {
      const rest = text.slice(m.index).replace(/^[^\n]*\n?/, '');
      const stop = rest.search(NEXT_SECTION_RX);
      const block = stop >= 0 ? rest.slice(0, stop) : rest;
      if (block.trim().length > src.length) src = block;
    }
    if (!src) return [];
    src = src.replace(/clauses\s*(?:&|and)?\s*warranties\s*[:\-]?/i, ' ');
    let items;
    if (/(?:^|\s)\d{1,3}[.)]\s/.test(src)) {
      items = src.split(/\s+(?=\d{1,3}[.)]\s)/);
    } else {
      items = src.split(/\s*[;\n•·]\s*|\s{2,}(?=[A-Z])/);
    }
    return items.map((s) => s.replace(/\s+/g, ' ').trim())
      .filter((s) => s && s.length > 2 && !/^(clauses|warranties|&|and)$/i.test(s));
  }

  // FULL-BLOCK CAPTURE — grab a field's entire detail (all lines) from its
  // header to the next field header, so nothing is truncated to one line.
  const escapeRx = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  // Distinctive next-field headers that mark where a captured block must STOP.
  const BOUNDARY_HEADERS = [
    'policy type', 'nature of business', 'period of insurance', 'locations of risk', 'location of risk',
    'sum insured', 'total sum insured', 'deductibles', 'clauses and warranties', 'clauses',
    'premium rate', 'brokerage rate', 'applicable premium', 'premium charges', 'premium payment',
    'revenue memorandum', 'revenue regulation', 'lead insurer', 'several liability', 'claims information',
    'choice of jurisdiction', 'policy form', 'validity of quote', 'percentage share',
  ];
  const BOUNDARY_RX = new RegExp('\\b(?:' + BOUNDARY_HEADERS.map(escapeRx).join('|') + ')\\b', 'i');
  function grabBlock(candidates, text) {
    if (!text) return '';
    let best = null;
    for (const c of candidates) {
      const rx = new RegExp('(?:^|\\n)\\s*' + escapeRx(c) + '\\s*[:\\-–]', 'i');
      const m = rx.exec(text);
      if (m && (best === null || m.index < best.i)) best = { i: m.index, e: m.index + m[0].length };
    }
    if (!best) return '';
    const rest = text.slice(best.e);
    const n = rest.search(BOUNDARY_RX);
    let block = n >= 0 ? rest.slice(0, n) : rest;
    if (block.length > 1500) block = block.slice(0, 1500);
    return block.replace(/\s+/g, ' ').trim();
  }
  function splitSectioned(block) {
    const m = String(block).match(/section\s*(?:ii|2)\b|third\s*party/i);
    if (m && m.index > 0) return { s1: block.slice(0, m.index).trim(), s2: block.slice(m.index).trim() };
    return { s1: String(block).trim(), s2: '' };
  }
  function sectionVal(chunk) {
    if (!chunk) return '';
    return String(chunk).replace(/^\s*section\s*(?:i{1,2}|1|2)\b[^:]*:?\s*/i, '').trim() || String(chunk).trim();
  }

  function extract(parsed, fileName) {
    const prop = emptyProposal(fileName);
    prop.rawText = parsed.text || '';
    const pairs = parsed.pairs || [];
    const flagged = [];
    // Single-value fields take their own cell value (no block) so they never
    // bleed into the next field.
    const grab = (key, cands) => {
      const hit = findField(cands || FIELD_LABELS[key], pairs);
      if (hit) { if (hit.soft) flagged.push(key); return String(hit.value).trim(); }
      return '';
    };
    // Multi-line fields (Cover + sectioned fields) take the fuller of cell value
    // or the full detail block, bounded by the next distinctive field.
    const fullSrc = (list) => {
      const hit = findField(list, pairs);
      const pairVal = hit ? String(hit.value).trim() : '';
      const block = grabBlock(list, parsed.text || '');
      return block.length > pairVal.length ? block : pairVal;
    };

    prop.insurers = extractInsurers(pairs, parsed.text || '', fileName);
    prop.policyType = grab('policyType');
    prop.insured = grab('insured');
    prop.natureOfBusiness = grab('natureOfBusiness');
    prop.project = grab('project');
    prop.periodOfInsurance = extractPeriod(pairs);
    prop.locationsOfRisks = grab('locationsOfRisks');
    prop.cover = fullSrc(FIELD_LABELS.cover);

    const siSrc = fullSrc(FIELD_LABELS.sumInsured);
    if (siSrc) {
      const parts = splitSectioned(siSrc);
      const m1 = parseMoney(parts.s1);
      if (m1) prop.sumInsured.sections[0].money = m1; else flagged.push('sumInsured');
      const m2 = parseMoney(parts.s2);
      if (m2) prop.sumInsured.sections[1].money = m2;
    }

    const deSrc = fullSrc(FIELD_LABELS.deductibles);
    if (deSrc) {
      const parts = splitSectioned(deSrc);
      prop.deductibles.sections[0].value = sectionVal(parts.s1);
      if (parts.s2) prop.deductibles.sections[1].value = sectionVal(parts.s2);
    }

    prop.clausesAndWarranties = extractClauses(pairs, parsed.text || '');
    const prSrc = fullSrc(FIELD_LABELS.premiumRate);
    if (prSrc) {
      const parts = splitSectioned(prSrc);
      prop.premiumRate.sections[0].value = sectionVal(parts.s1);
      if (parts.s2) prop.premiumRate.sections[1].value = sectionVal(parts.s2);
    }
    prop.brokerageRate = grab('brokerageRate');
    prop.premium = extractPremium(pairs);
    if (!prop.premium.total && prop.premium.lineItems.length === 0) flagged.push('premium');
    prop.premiumPaymentTerms = grab('premiumPaymentTerms');
    prop.birReference = grab('birReference');
    prop.leadInsurerClause = grab('leadInsurerClause');
    prop.severalLiabilityClause = grab('severalLiabilityClause');
    prop.claimsInformation = grab('claimsInformation');
    prop.choiceOfJurisdiction = grab('choiceOfJurisdiction');
    prop.policyForm = grab('policyForm');
    prop.validityOfQuote = grab('validityOfQuote');

    // confidence: how many core fields did we recover from HARD table rows?
    const core = [prop.insurers.length, prop.policyType, prop.insured,
      prop.sumInsured, prop.premium.total || prop.premium.lineItems.length];
    const got = core.filter(Boolean).length;
    prop.extractionConfidence = got >= 4 ? 'high' : got >= 2 ? 'medium' : 'low';
    prop.flaggedFields = [...new Set(flagged)];
    return prop;
  }
  CMP.extract = extract;

  /* ---------------------------------------------------------------
   * AI-EXTRACTION HOOK (optional, off by default)
   *
   * A browser-only app has nowhere safe to hold an API key, so the
   * heuristic engine above is the working default. To enable AI
   * extraction, host a tiny proxy that forwards {text} to Claude with
   * the schema prompt and returns JSON, then set CMP.AI_ENDPOINT below.
   * The proxy — not the browser — holds the API key.
   *
   *   POST {endpoint}  body: { text }   ->   { ...proposalJSON }
   *
   * Instruct the model to copy premium / sum-insured / deductible
   * figures CHARACTER-FOR-CHARACTER and to return insurers as an array.
   * ------------------------------------------------------------- */
  CMP.AI_ENDPOINT = null;
  CMP.extractWithAI = async function (parsed, fileName) {
    if (!CMP.AI_ENDPOINT) throw new Error('AI extraction not configured');
    const r = await fetch(CMP.AI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: parsed.text }),
    });
    if (!r.ok) throw new Error('AI endpoint error ' + r.status);
    const json = await r.json();
    return Object.assign(emptyProposal(fileName), json, { rawText: parsed.text });
  };

  /* ---------------------------------------------------------------
   * LOGO helpers
   * ------------------------------------------------------------- */
  function initials(name) {
    if (!name) return '?';
    const words = name.replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }
  CMP.initials = initials;

  // Validity-of-quote lapse check against a reference date (today).
  CMP.quoteStatus = function (validityText, refDate) {
    if (!validityText) return { known: false };
    const t = validityText.trim();
    // try to find an explicit date
    const dateMatch = t.match(/(\d{4}-\d{2}-\d{2})|(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})|([A-Za-z]{3,9}\.?\s+\d{1,2},?\s+\d{4})|(\d{1,2}\s+[A-Za-z]{3,9}\.?\s+\d{4})/);
    if (dateMatch) {
      const d = new Date(dateMatch[0]);
      if (!isNaN(d)) return { known: true, date: d, lapsed: d < refDate };
    }
    return { known: false };
  };

  /* ---------------------------------------------------------------
   * OVERALL ANALYSIS — aggregate analytics across all proposals.
   * Verbatim slip figures are surfaced as-is; anything the app derives
   * (spread, average, saving %) is labelled "computed" so it is never
   * confused with a figure copied from a slip.
   * ------------------------------------------------------------- */
  CMP.analyze = function (proposals, refDate) {
    const A = { count: proposals.length };
    const withTotal = proposals
      .map((p) => ({ p, amt: CMP.premiumTotalAmount(p), disp: CMP.premiumTotalDisplay(p) }))
      .filter((x) => x.amt != null);
    A.withTotalCount = withTotal.length;
    if (withTotal.length) {
      A.lowest = withTotal.reduce((a, b) => (a.amt <= b.amt ? a : b));
      A.highest = withTotal.reduce((a, b) => (a.amt >= b.amt ? a : b));
      const amts = withTotal.map((x) => x.amt);
      A.avg = amts.reduce((s, x) => s + x, 0) / amts.length;
      A.spread = A.highest.amt - A.lowest.amt;
      A.savingsPct = A.highest.amt > 0 ? (A.spread / A.highest.amt) * 100 : 0;
      A.symbol = (A.lowest.disp.match(/[₱$€£¥]/) || ['₱'])[0];
    }
    const cov = (p) => p.clausesAndWarranties.length + ((p.cover || '').length / 200);
    A.coverage = proposals.map((p) => ({ p, score: cov(p), clauses: p.clausesAndWarranties.length }));
    if (proposals.length) A.mostCoverage = A.coverage.reduce((a, b) => (a.score >= b.score ? a : b));
    A.lapsed = proposals.filter((p) => { const q = CMP.quoteStatus(p.validityOfQuote, refDate); return q.known && q.lapsed; });
    A.review = proposals.filter((p) => p.extractionConfidence === 'low' || (p.flaggedFields && p.flaggedFields.length));
    A.policyTypes = [...new Set(proposals.map((p) => p.policyType).filter(Boolean))];
    A.completeness = proposals.map((p) => {
      const total = 8; let filled = 0;
      if (p.insurers.length) filled++;
      if (p.policyType) filled++;
      if (p.insured) filled++;
      if (CMP.primaryMoney(p.sumInsured)) filled++;
      if (p.cover) filled++;
      if (CMP.premiumTotalAmount(p) != null || (p.premium && p.premium.lineItems.length)) filled++;
      if (p.periodOfInsurance && (p.periodOfInsurance.from || p.periodOfInsurance.to)) filled++;
      if (p.clausesAndWarranties.length) filled++;
      return { p, pct: Math.round((filled / total) * 100) };
    });
    return A;
  };

  // Interactive value ranking. weight 0 = all price, 1 = all coverage.
  CMP.valueRanking = function (proposals, weight) {
    const totals = proposals.map((p) => CMP.premiumTotalAmount(p));
    const priced = totals.filter((x) => x != null);
    const minP = priced.length ? Math.min(...priced) : null;
    const maxP = priced.length ? Math.max(...priced) : null;
    const cov = proposals.map((p) => p.clausesAndWarranties.length + ((p.cover || '').length / 200));
    const minC = Math.min(...cov), maxC = Math.max(...cov);
    return proposals
      .map((p, i) => {
        const amt = totals[i];
        let priceScore = 0.5;
        if (amt == null) priceScore = 0;
        else if (maxP === minP) priceScore = 1;
        else priceScore = (maxP - amt) / (maxP - minP);
        const covScore = maxC === minC ? 1 : (cov[i] - minC) / (maxC - minC);
        return { p, score: (1 - weight) * priceScore + weight * covScore, priceScore, covScore, hasPrice: amt != null };
      })
      .sort((a, b) => b.score - a.score);
  };

  // Format an app-computed amount (NOT a verbatim slip figure) with 2 decimals.
  CMP.formatComputed = function (amount, symbol) {
    if (amount == null || !isFinite(amount)) return '—';
    return (symbol || '') + ' ' + amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  /* ---------------------------------------------------------------
   * COMPARATIVE MATRIX — build a broker-style compliance matrix from
   * extracted proposals: a baseline ("proposed terms") column plus one
   * column per insurer, each cell a check (✓ = as proposed) when it
   * matches the baseline, or the specific deviation text otherwise.
   * ------------------------------------------------------------- */
  CMP.isDeleted = function (s) { return /^\s*(deleted|not applicable|n\/?a|nil)\b/i.test(String(s || '')); };

  CMP.buildMatrixFromProposals = function (proposals, baselineId) {
    const nm = (p) => (p.insurers[0] && p.insurers[0].name) || p.fileName;
    const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const money = (m) => (m ? CMP.formatMoney(m) : '');
    const baseline = baselineId && baselineId !== 'none' ? proposals.find((p) => p.id === baselineId) : null;
    const colProps = baseline ? proposals.filter((p) => p.id !== baseline.id) : proposals;
    const columns = colProps.map((p) => ({ id: p.id, name: nm(p), logoUrl: (p.insurers[0] && p.insurers[0].logoUrl) || '', p }));

    function makeRow(field, getter, opts) {
      opts = opts || {};
      const key = opts.key || '';
      const g = (p) => {
        if (key && p && p.overrides && p.overrides[key] != null && p.overrides[key] !== '') return p.overrides[key];
        return getter(p);
      };
      const bt = baseline ? g(baseline) : (opts.howden || '');
      const cells = {};
      columns.forEach((c) => {
        const ct = g(c.p);
        if (!ct) cells[c.id] = { t: 'empty', raw: '' };
        else if (baseline && bt && norm(ct) === norm(bt)) cells[c.id] = { t: 'check', raw: ct };
        else cells[c.id] = { t: 'text', v: ct, raw: ct, dev: !!(baseline && bt && norm(ct) !== norm(bt)) };
      });
      return { field: field, howden: baseline ? bt : (opts.howden || ''), cells: cells, newField: opts.newField !== false, total: !!opts.total, key: key, subLabel: opts.subLabel };
    }

    const rows = [];

    // Sum Insured / Deductibles / Premium Rate — each shown in ONE box, sections
    // listed line by line (just like the quotation slip field).
    const core = [
      ['POLICY TYPE', (p) => p.policyType, 'policyType'],
      ['INSURED', (p) => p.insured, 'insured'],
      ['NATURE OF BUSINESS', (p) => p.natureOfBusiness, 'natureOfBusiness'],
      ['PROJECT', (p) => p.project, 'project'],
      ['PERIOD OF INSURANCE', (p) => [p.periodOfInsurance.from, p.periodOfInsurance.to].filter(Boolean).join(' – '), 'periodOfInsurance'],
      ['LOCATIONS OF RISKS', (p) => p.locationsOfRisks, 'locationsOfRisks'],
      ['COVER', (p) => p.cover, 'cover'],
      ['SUM INSURED', (p) => CMP.formatSections(p.sumInsured), 'sumInsured'],
      ['DEDUCTIBLES', (p) => CMP.formatSections(p.deductibles), 'deductibles'],
      ['PREMIUM RATE', (p) => CMP.formatSections(p.premiumRate), 'premiumRate'],
      ['BROKERAGE RATE', (p) => p.brokerageRate, 'brokerageRate'],
    ];
    core.forEach((f) => rows.push(makeRow(f[0], f[1], { key: f[2] })));

    const seen = new Map();
    proposals.forEach((p) => (p.premium && p.premium.lineItems ? p.premium.lineItems : []).forEach((li) => { const k = norm(li.label); if (!seen.has(k)) seen.set(k, li.label); }));
    const premLabels = [...seen.values()];
    const compVal = (p, label) => { const items = p.premium && p.premium.lineItems ? p.premium.lineItems : []; const li = items.find((x) => norm(x.label) === norm(label)); return li ? CMP.formatMoney(li.money) : ''; };
    premLabels.forEach((lab, i) => rows.push(makeRow(i === 0 ? 'APPLICABLE PREMIUM CHARGES' : '', (p) => compVal(p, lab), { howden: lab, newField: i === 0, subLabel: lab, key: 'premium:' + lab })));
    rows.push(makeRow('', (p) => (p.premium && p.premium.total ? CMP.formatMoney(p.premium.total.money) : ''), { howden: 'TOTAL PREMIUM', newField: premLabels.length === 0, total: true, subLabel: 'TOTAL PREMIUM', key: 'premiumTotal' }));

    // Clauses & Warranties — the FULL numbered list shown in one whole box per
    // insurer, just like the quotation slip (every wording captured, numbered).
    const numberedClauses = (p) => (p.clausesAndWarranties || [])
      .map((c, i) => (/^\s*\d+[.)]/.test(String(c)) ? String(c).trim() : (i + 1) + '. ' + String(c).trim()))
      .join('\n');

    const tail = [
      ['PREMIUM PAYMENT TERMS', (p) => p.premiumPaymentTerms, 'premiumPaymentTerms'],
      ['CLAUSES & WARRANTIES', numberedClauses, 'clauses'],
      ['LEAD INSURER CLAUSE', (p) => p.leadInsurerClause, 'leadInsurerClause'],
      ['SEVERAL LIABILITY CLAUSE', (p) => p.severalLiabilityClause, 'severalLiabilityClause'],
      ['CLAIMS INFORMATION', (p) => p.claimsInformation, 'claimsInformation'],
      ['CHOICE OF JURISDICTION, LAW & PRACTICE', (p) => p.choiceOfJurisdiction, 'choiceOfJurisdiction'],
      ['POLICY FORM', (p) => p.policyForm, 'policyForm'],
      ['VALIDITY OF QUOTE', (p) => p.validityOfQuote, 'validityOfQuote'],
    ];
    tail.forEach((f) => rows.push(makeRow(f[0], f[1], { key: f[2] })));

    const insuredName = [...new Set(proposals.map((p) => (p.insured || '').trim()).filter(Boolean))][0] || '';
    return {
      // Header reads: Insured name (heading) with "Comparative Matrix" directly below.
      eyebrow: '',
      title: insuredName || 'Comparative Matrix',
      subtitle: insuredName ? 'Comparative Matrix' : '',
      baseline: baseline ? { id: baseline.id, name: nm(baseline), role: 'Selected baseline' } : null,
      columns: columns.map((c) => ({ id: c.id, name: c.name, logoUrl: c.logoUrl })),
      rows: rows,
      footnotes: [],
    };
  };

  /* ---------------------------------------------------------------
   * EXPORT — write the comparative matrix to a real .xlsx workbook,
   * entirely in the browser (SheetJS). Cells become ✓ / deviation / —
   * exactly as shown; money strings preserved verbatim.
   * ------------------------------------------------------------- */
  CMP.cellToText = function (cell) {
    if (!cell || cell.t === 'empty') return '—';
    if (cell.t === 'check') return '✓ As proposed';
    return cell.v || '';
  };
  // Brief on-screen confirmation so a silent browser download is never mistaken
  // for "nothing happened".
  CMP.toast = function (msg) {
    try {

/* ---------- small presentational helpers ---------- */

function Logo({ name, url, size = 40 }) {
  const s = { width: size, height: size };
  if (url) {
    return (
      <div className="rounded-md bg-white ring-1 ring-slate-200 flex items-center justify-center overflow-hidden shrink-0" style={s}>
        <img src={url} alt={name + ' logo'} className="max-w-full max-h-full object-contain" />
      </div>
    );
  }
  const palette = ['bg-sky-600','bg-[#0047AB]','bg-teal-600','bg-red-600','bg-amber-600','bg-violet-600'];
  const idx = (name || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % palette.length;
  return (
    <div className={'rounded-md text-white flex items-center justify-center font-semibold shrink-0 ' + palette[idx]} style={s}>
      {CMP.initials(name)}
    </div>
  );
}

function InsurerHeader({ prop, onAssignLogo }) {
  const fileRef = useRef();
  const multi = prop.insurers.length > 1;
  const primary = prop.insurers[0] || { name: prop.fileName || 'Unknown insurer' };
  return (
    <div className="flex items-start gap-3">
      <Logo name={primary.name} url={primary.logoUrl} />
      <div className="min-w-0 flex-1">
        {multi ? (
          <div>
            <div className="text-xs uppercase tracking-wide text-slate-400 font-medium">Co-insurance placement</div>
            <ul className="mt-0.5 space-y-0.5">
              {prop.insurers.map((ins, i) => (
                <li key={i} className="flex items-center gap-2 text-sm">
                  <span className="font-semibold text-slate-800 truncate">{ins.name || 'Unnamed'}</span>
                  {ins.percentageShare && (
                    <span className="text-xs font-medium text-slate-500 tnum">{ins.percentageShare}</span>
                  )}
                </li>
              ))}
            </ul>
          </div>
        ) : (
          <div className="font-semibold text-slate-800 leading-tight truncate">{primary.name || 'Unknown insurer'}</div>
        )}
        <button
          className="mt-1 text-[11px] text-sky-600 hover:underline"
          onClick={() => fileRef.current && fileRef.current.click()}
        >
          Assign logo
        </button>
        <input ref={fileRef} type="file" accept="image/*" className="hidden"
          onChange={(e) => {
            const f = e.target.files[0]; if (!f) return;
            const rd = new FileReader();
            rd.onload = () => onAssignLogo(prop.id, rd.result);
            rd.readAsDataURL(f);
          }} />
      </div>
    </div>
  );
}

function ConfidenceDot({ level }) {
  const map = { high: 'bg-emerald-500', medium: 'bg-amber-500', low: 'bg-red-500' };
  return (
    <span className="inline-flex items-center gap-1 text-[11px] text-slate-500">
      <span className={'w-2 h-2 rounded-full ' + (map[level] || 'bg-slate-400')} />
      {level} confidence
    </span>
  );
}

function Amount({ money, big }) {
  const txt = CMP.formatMoney(money);
  const unknown = !money || !money.amountDisplay;
  return (
    <span className={(big ? 'text-2xl font-bold ' : 'text-sm ') + 'mono-amt tnum ' + (unknown ? 'text-red-500 text-sm font-normal italic' : 'text-slate-900')}>
      {txt}
    </span>
  );
}

/* ---------- editable fields (typable amounts / rates) ---------- */
// Click-to-edit money field. Typing is always allowed — handy when a figure
// wasn't detected. Typed value stored VERBATIM (parseMoney keeps trailing zeros).
function EditableAmount({ money, onChange, placeholder, big }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState('');
  const display = money && money.amountDisplay ? (money.symbol || '') + ' ' + money.amountDisplay : '';
  const commit = () => {
    setEditing(false);
    const t = (val || '').trim();
    if (!t) return onChange(null);
    onChange(CMP.parseMoney(t) || { amountDisplay: t, amount: null, currency: 'PHP', symbol: '' });
  };
  if (editing) {
    return (
      <input autoFocus value={val} onChange={(e) => setVal(e.target.value)} onBlur={commit}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') setEditing(false); }}
        placeholder="e.g. 500,000.00"
        className={'w-full mono-amt tnum rounded border border-[#0047AB] px-1.5 py-0.5 outline-none ' + (big ? 'text-lg font-bold' : 'text-sm')} />
    );
  }
  return (
    <button type="button" title="Click to edit"
      onClick={() => { setVal(money && money.amountDisplay ? money.amountDisplay : ''); setEditing(true); }}
      className={'group text-left mono-amt tnum ' + (display ? (big ? 'text-2xl font-bold text-slate-900' : 'text-sm text-slate-900') : 'text-sm italic text-red-500')}>
      {display || placeholder || 'Not detected — tap to enter'}
      <span className="ml-1 align-middle text-[10px] text-slate-300 group-hover:text-[#0047AB] no-print">✎</span>
    </button>
  );
}

// Click-to-edit plain text field (rate strings like "0.15%").
function EditableText({ value, onChange, placeholder }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState('');
  const commit = () => { setEditing(false); onChange((val || '').trim()); };
  if (editing) {
    return (
      <input autoFocus value={val} onChange={(e) => setVal(e.target.value)} onBlur={commit}
        onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') setEditing(false); }}
        className="w-full text-sm rounded border border-[#0047AB] px-1.5 py-0.5 outline-none" />
    );
  }
  return (
    <button type="button" title="Click to edit" onClick={() => { setVal(value || ''); setEditing(true); }}
      className={'group text-left text-sm ' + (value ? 'text-slate-700' : 'text-slate-400 italic')}>
      {value || placeholder || 'Tap to enter'}
      <span className="ml-1 text-[10px] text-slate-300 group-hover:text-[#0047AB] no-print">✎</span>
    </button>
  );
}

// Editable, labelled sub-fields for Sum Insured / Deductibles (Section I, II, …).
function SectionedAmount({ field, onChange }) {
  const secs = CMP.sectionsOf(field);
  const update = (next) => onChange({ sections: next });
  const setSec = (i, patch) => { const n = secs.slice(); n[i] = { ...n[i], ...patch }; update(n); };
  const addSection = () => update([...secs, { label: 'New section', money: null }]);
  const removeSection = (i) => { const n = secs.slice(); n.splice(i, 1); update(n); };
  return (
    <div className="rounded-lg bg-slate-50 ring-1 ring-slate-200 divide-y divide-slate-200">
      {secs.map((s, i) => (
        <div key={i} className="flex items-center justify-between gap-2 px-2.5 py-1.5">
          <div className="min-w-0 flex-1"><EditableText value={s.label} onChange={(v) => setSec(i, { label: v })} placeholder="Section label" /></div>
          <div className="flex items-center gap-1 shrink-0">
            <EditableAmount money={s.money} onChange={(m) => setSec(i, { money: m })} placeholder="Tap to enter" />
            <button type="button" onClick={() => removeSection(i)} title="Remove section" className="text-slate-300 hover:text-red-500 text-xs no-print">✕</button>
          </div>
        </div>
      ))}
      <button type="button" onClick={addSection} className="w-full text-left px-2.5 py-1 text-[11px] text-[#0047AB] hover:underline no-print">+ Add section</button>
    </div>
  );
}

// Editable, labelled sub-fields with text values (e.g. Premium Rate sections).
function SectionedText({ field, onChange }) {
  const secs = CMP.sectionsOf(field);
  const update = (next) => onChange({ sections: next });
  const setSec = (i, patch) => { const n = secs.slice(); n[i] = { ...n[i], ...patch }; update(n); };
  const addSection = () => update([...secs, { label: 'New section', value: '' }]);
  const removeSection = (i) => { const n = secs.slice(); n.splice(i, 1); update(n); };
  return (
    <div className="rounded-lg bg-slate-50 ring-1 ring-slate-200 divide-y divide-slate-200 overflow-hidden">
      {secs.map((s, i) => (
        <div key={i} className="flex items-center gap-2 px-2.5 py-1.5">
          <div className="min-w-0 flex-1"><EditableText value={s.label} onChange={(v) => setSec(i, { label: v })} placeholder="Section label" /></div>
          <span className="text-slate-300">:</span>
          <div className="min-w-0 flex-1"><EditableText value={s.value} onChange={(v) => setSec(i, { value: v })} placeholder="Tap to enter" /></div>
          <button type="button" onClick={() => removeSection(i)} title="Remove section" className="text-slate-300 hover:text-red-500 text-xs no-print">✕</button>
        </div>
      ))}
      <button type="button" onClick={addSection} className="w-full text-left px-2.5 py-1 text-[11px] text-[#0047AB] hover:underline no-print">+ Add section</button>
    </div>
  );
}

/* ---------- premium breakdown block ---------- */
function PremiumBlock({ premium, editable, hideTotal, onEditItem, onEditTotal }) {
  const items = (premium && premium.lineItems) || [];
  const hasAny = premium && (premium.total || items.length);
  if (!hasAny && !editable) {
    return <div className="text-sm italic text-red-500">Not detected — verify manually</div>;
  }
  if (hideTotal && !items.length) {
    return <div className="text-sm italic text-slate-400">No premium charges detected</div>;
  }
  return (
    <div className="rounded-lg bg-slate-50 ring-1 ring-slate-200 divide-y divide-slate-200 overflow-hidden">
      {items.map((li, i) => (
        <div key={i} className="flex items-center justify-between gap-2 px-3 py-1.5">
          <span className="text-sm text-slate-600">{li.label}</span>
          {editable ? <EditableAmount money={li.money} onChange={(m) => onEditItem(i, m)} /> : <Amount money={li.money} />}
        </div>
      ))}
      {!hideTotal && (
        <div className="flex items-center justify-between gap-2 px-3 py-2 bg-slate-100">
          <span className="text-sm font-semibold text-slate-700">{premium && premium.total ? premium.total.label : 'TOTAL PREMIUM'}</span>
          {editable
            ? <EditableAmount money={premium && premium.total ? premium.total.money : null} onChange={onEditTotal} placeholder="Tap to enter total" big />
            : (premium && premium.total
              ? <Amount money={premium.total.money} big />
              : <span className="text-sm italic text-red-500">Total not stated — verify manually</span>)}
        </div>
      )}
    </div>
  );
}

/* ---------- badges ---------- */
function Badge({ children, tone }) {

/* ---------- expandable section ---------- */
function Section({ title, children, defaultOpen }) {

    <div className="border-t border-slate-100 pt-2">
      <button className="w-full flex items-center justify-between text-left" onClick={() => setOpen(!open)}>

function Field({ label, value }) {

    <div>

}

/* ---------- proposal card ---------- */
function pcWithTotal(p, m) {
  const premium = p.premium || { lineItems: [], total: null, currency: 'PHP' };
  return { ...p, premium: { ...premium, total: m ? { label: (premium.total && premium.total.label) || 'TOTAL PREMIUM', money: m } : null } };
}
function pcWithItem(p, i, m) {
  const premium = p.premium || { lineItems: [], total: null, currency: 'PHP' };
  const items = premium.lineItems.slice();
  if (m) items[i] = { ...items[i], money: m }; else items.splice(i, 1);
  return { ...p, premium: { ...premium, lineItems: items } };
}
function ProposalCard({ prop, badges, onAssignLogo, onEdit }) {
  const q = CMP.quoteStatus(prop.validityOfQuote, TODAY);
  const edit = onEdit || (() => {});
  return (
    <div className="bg-white rounded-xl ring-1 ring-slate-200 shadow-sm p-4 flex flex-col gap-3">

      </div>

      <div className="flex flex-wrap gap-1.5">
        {prop.policyType && <Badge>{prop.policyType}</Badge>}
        {badges.bestPrice && <Badge tone="price">Best Price (auto)</Badge>}
        {badges.mostCoverage && <Badge tone="cover">Most Coverage (auto)</Badge>}
        {q.known && q.lapsed && <Badge tone="lapse">Quote lapsed</Badge>}
        {(prop.extractionConfidence === 'low' || prop.flaggedFields.length > 0) && <Badge tone="review">Needs review</Badge>}
      </div>

      <div className="space-y-3">
        <div>
          <div className="text-base font-bold uppercase tracking-wide text-black">Sum Insured</div>
          <div className="mt-1"><SectionedAmount field={prop.sumInsured} onChange={(v) => edit((p) => ({ ...p, sumInsured: v }))} /></div>
        </div>
        <div>
          <div className="text-base font-bold uppercase tracking-wide text-black">Deductibles</div>
          <div className="mt-1"><SectionedText field={prop.deductibles} onChange={(v) => edit((p) => ({ ...p, deductibles: v }))} /></div>
        </div>
        <div>
          <div className="text-base font-bold uppercase tracking-wide text-black">Premium Rate</div>
          <div className="mt-1"><SectionedText field={prop.premiumRate} onChange={(v) => edit((p) => ({ ...p, premiumRate: v }))} /></div>
        </div>
        <div>
          <div className="text-base font-bold uppercase tracking-wide text-black">Brokerage Rate</div>
          <div className="mt-1"><EditableText value={prop.brokerageRate} onChange={(v) => edit((p) => ({ ...p, brokerageRate: v }))} placeholder="Tap to enter" /></div>
        </div>

      {prop.rawText && (

        </Section>
      )}

      <div className="flex items-center justify-between pt-1">

/* ---------- comparison table ---------- */
const TABLE_ROWS = [
  { key: 'insurers', label: 'Insurer(s) / Share', get: (p) => p.insurers.map((i) => i.name + (i.percentageShare ? ' (' + i.percentageShare + ')' : '')).join('; ') },
  { key: 'policyType', label: 'Policy Type', get: (p) => p.policyType },
  { key: 'insured', label: 'Insured', get: (p) => p.insured },
  { key: 'natureOfBusiness', label: 'Nature of Business', get: (p) => p.natureOfBusiness },
  { key: 'project', label: 'Project / Asset', get: (p) => p.project },
  { key: 'period', label: 'Period of Insurance', get: (p) => [p.periodOfInsurance.from, p.periodOfInsurance.to].filter(Boolean).join(' – ') },
  { key: 'locationsOfRisks', label: 'Locations of Risks', get: (p) => p.locationsOfRisks },
  { key: 'cover', label: 'Cover', get: (p) => p.cover },
  { key: 'sumInsured', label: 'Sum Insured', money: true, get: (p) => p.sumInsured },
  { key: 'deductibles', label: 'Deductibles', money: true, get: (p) => p.deductibles },
  { key: 'premiumRate', label: 'Premium Rate', get: (p) => p.premiumRate },
  { key: 'brokerageRate', label: 'Brokerage Rate', get: (p) => p.brokerageRate },
  { key: 'premiumTotal', label: 'Total Premium', money: true, get: (p) => p.premium && p.premium.total ? p.premium.total.money : null },
  { key: 'premiumPaymentTerms', label: 'Premium Payment Terms', get: (p) => p.premiumPaymentTerms },
  { key: 'birReference', label: 'BIR RMO / RR Reference', get: (p) => p.birReference },
  { key: 'clausesAndWarranties', label: 'Clauses & Warranties', get: (p) => p.clausesAndWarranties.join('; ') },
  { key: 'leadInsurerClause', label: 'Lead Insurer Clause', get: (p) => p.leadInsurerClause },
  { key: 'severalLiabilityClause', label: 'Several Liability Clause', get: (p) => p.severalLiabilityClause },
  { key: 'claimsInformation', label: 'Claims Information', get: (p) => p.claimsInformation },
  { key: 'choiceOfJurisdiction', label: 'Jurisdiction, Law & Practice', get: (p) => p.choiceOfJurisdiction },
  { key: 'policyForm', label: 'Policy Form', get: (p) => p.policyForm },
  { key: 'validityOfQuote', label: 'Validity of Quote', get: (p) => p.validityOfQuote },
];

function cellText(row, p) {
  if (row.money) { const m = row.get(p); return m ? CMP.formatMoney(m) : ''; }
  return row.get(p) || '';
}

function ComparisonTable({ proposals, onlyDiff, onAssignLogo }) {
  const rows = useMemo(() => {
    return TABLE_ROWS.filter((row) => {
      if (!onlyDiff) return true;
      const vals = proposals.map((p) => cellText(row, p).trim());
      const uniq = new Set(vals.filter(Boolean));
      // a row "differs" if there is more than one distinct non-empty value
      return uniq.size > 1;
    });
  }, [proposals, onlyDiff]);

  return (
    <div className="cmp-scroll overflow-auto rounded-xl ring-1 ring-slate-200 bg-white">
      <table className="min-w-full border-collapse text-sm">
        <thead>
          <tr>
            <th className="sticky left-0 top-0 z-20 bg-slate-50 text-left px-3 py-3 font-semibold text-slate-500 w-56 border-b border-slate-200">Field</th>
            {proposals.map((p) => (
              <th key={p.id} className="sticky top-0 z-10 bg-slate-50 px-3 py-3 text-left border-b border-slate-200 min-w-[220px] align-top">
                <InsurerHeader prop={p} onAssignLogo={onAssignLogo} />
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((row) => {
            const vals = proposals.map((p) => cellText(row, p).trim());
            const uniq = new Set(vals.filter(Boolean));
            const differs = uniq.size > 1;
            return (
              <tr key={row.key} className={differs ? 'bg-amber-50/40' : ''}>
                <th className="sticky left-0 z-10 bg-white text-left align-top px-3 py-2 font-medium text-slate-500 border-b border-slate-100">{row.label}</th>
                {proposals.map((p) => {
                  const m = row.money ? row.get(p) : null;
                  return (
                    <td key={p.id} className="px-3 py-2 align-top border-b border-slate-100">
                      {row.money
                        ? (m ? <span className="mono-amt tnum">{CMP.formatMoney(m)}</span> : <span className="italic text-slate-400">—</span>)
                        : (row.get(p) ? <span className="whitespace-pre-wrap break-words text-slate-700">{row.get(p)}</span> : <span className="italic text-slate-400">—</span>)}
                    </td>
                  );
                })}
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ---------- file chip ---------- */
function FileChip({ f, onRemove }) {
  const statusMap = {
    processing: { t: 'Processing…', c: 'bg-sky-100 text-sky-700' },
    parsed: { t: 'Parsed', c: 'bg-emerald-100 text-emerald-700' },
    review: { t: 'Needs review', c: 'bg-amber-100 text-amber-700' },
    error: { t: 'Error', c: 'bg-red-100 text-red-700' },
  };
  const st = statusMap[f.status] || statusMap.processing;
  return (
    <div className="flex items-center gap-2 rounded-full bg-white ring-1 ring-slate-200 pl-3 pr-1.5 py-1 text-sm">
      <span className="truncate max-w-[180px] text-slate-700" title={f.name}>{f.name}</span>
      {f.insurer && <span className="text-slate-400">·</span>}
      {f.insurer && <span className="text-slate-500 truncate max-w-[120px]">{f.insurer}</span>}
      <span className={'rounded-full px-2 py-0.5 text-[11px] ' + st.c}>{st.t}</span>
      <button className="w-5 h-5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700" onClick={() => onRemove(f.id)}>×</button>

}

/* ---------- premium comparison mini-chart (dependency-free) ---------- */
function PremiumChart({ proposals }) {
  const data = proposals
    .map((p) => ({ name: (p.insurers[0] && p.insurers[0].name) || p.fileName, amt: CMP.premiumTotalAmount(p), disp: CMP.premiumTotalDisplay(p) }))
    .filter((d) => d.amt != null);
  if (data.length < 2) return null;
  const max = Math.max(...data.map((d) => d.amt));
  const min = Math.min(...data.map((d) => d.amt));
  return (
    <div className="bg-white rounded-xl ring-1 ring-slate-200 p-4 mb-4">
      <div className="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-3">Total premium comparison</div>
      <div className="space-y-2">
        {data.map((d, i) => (
          <div key={i} className="flex items-center gap-3">
            <div className="w-40 truncate text-sm text-slate-600" title={d.name}>{d.name}</div>
            <div className="flex-1 bg-slate-100 rounded h-6 relative overflow-hidden">
              <div className={'h-6 rounded ' + (d.amt === min ? 'bg-emerald-500' : d.amt === max ? 'bg-slate-400' : 'bg-sky-500')}
                   style={{ width: Math.max(6, (d.amt / max) * 100) + '%' }} />
            </div>
            <div className="w-36 text-right mono-amt tnum text-sm text-slate-800">{d.disp}</div>
          </div>
        ))}
      </div>
      <div className="mt-2 text-[11px] text-slate-400">Lowest total shown in green. Bars scale to the highest total. Figures are copied verbatim from each slip.</div>
    </div>
  );
}

/* ---------- comparative matrix view ---------- */
function MatrixCell({ cell }) {
  if (!cell || cell.t === 'empty') return <span className="text-slate-300">—</span>;
  if (cell.t === 'check') {
    return <span className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold" title="As proposed">✓</span>;
  }
  const deleted = CMP.isDeleted(cell.v);
  return (
    <div className="max-h-[24rem] overflow-y-auto cmp-scroll pr-1">
      <span className={'whitespace-pre-wrap break-words ' + (deleted ? 'text-red-600 font-medium' : 'text-slate-800')}>{cell.v}</span>
    </div>

}

// Click-to-edit matrix cell (multi-line). Blank clears the override.
function MatrixEditableCell({ cell, onCommit }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState('');
  if (editing) {
    const rows = Math.min(10, Math.max(1, (val.match(/\n/g) || []).length + 1));
    return (
      <textarea autoFocus value={val} rows={rows} onChange={(e) => setVal(e.target.value)} onBlur={() => { setEditing(false); onCommit(val); }} onKeyDown={(e) => { if (e.key === 'Escape') setEditing(false); }} className="w-full text-[13px] rounded border border-[#0047AB] px-1.5 py-1 outline-none resize-y" />
    );
  }
  const deleted = cell && cell.t === 'text' && CMP.isDeleted(cell.v);
  return (
    <button type="button" title="Click to edit" onClick={() => { setVal(cell && cell.raw != null ? String(cell.raw) : ''); setEditing(true); }} className="group text-left w-full block max-h-[24rem] overflow-y-auto cmp-scroll pr-1">
      {(!cell || cell.t === 'empty') ? <span className="text-slate-300">—</span>
        : cell.t === 'check' ? <span className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold" title="As proposed">✓</span>
        : <span className={'whitespace-pre-wrap break-words ' + (deleted ? 'text-red-600 font-medium' : 'text-slate-800')}>{cell.v}</span>}
      <span className="ml-1 align-top text-[10px] text-slate-300 group-hover:text-[#0047AB] no-print">✎</span>
    </button>
  );
}

}
function MatrixArchiveIcon() {
  return (
    <svg viewBox="0 0 24 24" className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="4" rx="1" /><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8" /><path d="M10 12h4" />

function MatrixView({ matrix, controls, onEdit, onSave, onArchive }) {
  const hasBaseline = !!matrix.baseline;
  const cols = matrix.columns;
  const editable = typeof onEdit === 'function';
  const [busy, setBusy] = useState(null);
  // Run an action with a disabled + spinner state; catch failures → error toast.
  const run = async (kind, fn) => {
    if (busy) return;
    setBusy(kind);
    await new Promise((res) => setTimeout(res, 0)); // let the spinner paint before sync work
    try { await fn(); }
    catch (e) { CMP.toast('Sorry — that action failed: ' + (e && e.message ? e.message : e)); }
    finally { setBusy(null); }
  };
  return (
    <div id="matrix-print" className="rounded-2xl ring-1 ring-slate-200 shadow-sm bg-white overflow-hidden">
      <div className="bg-gradient-to-r from-[#211E24] to-[#141216] text-white px-5 py-4 flex items-start justify-between gap-4">
        <div>
          {matrix.eyebrow && <div className="text-[11px] font-semibold uppercase tracking-[0.2em] text-[#3F7FD6]">{matrix.eyebrow}</div>}
          <div className="text-lg font-bold leading-tight">{matrix.title}</div>

/* ---------- overall analysis (Overview view) ---------- */
function KpiTile({ label, tone, children }) {
  const ring = tone === 'good' ? 'ring-emerald-200 bg-emerald-50' : tone === 'warn' ? 'ring-amber-200 bg-amber-50' : 'ring-slate-200 bg-white';
  return (
    <div className={'rounded-xl ring-1 p-3 ' + ring}>
      <div className="text-[11px] uppercase tracking-wide text-slate-400">{label}</div>
      <div className="mt-1">{children}</div>
    </div>
  );
}

function nameOf(p) { return (p.insurers[0] && p.insurers[0].name) || p.fileName; }

function ValueRanker({ proposals }) {
  const [weight, setWeight] = useState(0.5);
  const ranked = CMP.valueRanking(proposals, weight);
  const max = Math.max(...ranked.map((r) => r.score), 0.0001);
  return (
    <div>
      <div className="flex items-center gap-3 mb-3">
        <span className="text-xs text-slate-500 whitespace-nowrap">Prioritise price</span>
        <input type="range" min="0" max="1" step="0.05" value={weight} onChange={(e) => setWeight(Number(e.target.value))} className="flex-1" />
        <span className="text-xs text-slate-500 whitespace-nowrap">Prioritise coverage</span>
      </div>
      <div className="space-y-2">
        {ranked.map((r, i) => (
          <div key={r.p.id} className="flex items-center gap-3">
            <span className="w-5 text-right text-xs text-slate-400 tnum">{i + 1}</span>
            <span className="w-40 truncate text-sm text-slate-700" title={nameOf(r.p)}>{nameOf(r.p)}</span>
            <div className="flex-1 bg-slate-100 rounded h-5 overflow-hidden">
              <div className={'h-5 rounded ' + (i === 0 ? 'bg-[#0047AB]' : 'bg-[#A7C6EF]')} style={{ width: Math.max(4, (r.score / max) * 100) + '%' }} />
            </div>
            <span className="w-9 text-right text-xs tnum text-slate-500">{Math.round(r.score * 100)}</span>
          </div>
        ))}
      </div>
      <div className="mt-2 text-[11px] text-slate-400">Automated value score blending your price/coverage weighting — a comparison aid, not a recommendation. Always verify against the slips.</div>
    </div>
  );
}

function DiffAtAGlance({ proposals }) {
  const rows = [
    { label: 'Policy Type', get: (p) => p.policyType },
    { label: 'Period', get: (p) => [p.periodOfInsurance.from, p.periodOfInsurance.to].filter(Boolean).join(' – ') },
    { label: 'Sum Insured', get: (p) => CMP.formatSections(p.sumInsured) },
    { label: 'Deductibles', get: (p) => CMP.formatSections(p.deductibles) },
    { label: 'Total Premium', get: (p) => CMP.premiumTotalDisplay(p) },
    { label: 'Premium Rate', get: (p) => CMP.formatSections(p.premiumRate) },
  ];
  return (
    <div className="space-y-1.5">
      {rows.map((r, i) => {
        const vals = proposals.map((p) => (r.get(p) || '').trim());
        const uniq = new Set(vals.filter(Boolean));
        const differ = uniq.size > 1;
        const same = uniq.size === 1 ? [...uniq][0] : null;
        return (
          <div key={i} className="flex items-center gap-2 text-sm">
            <span className={'w-2 h-2 rounded-full shrink-0 ' + (differ ? 'bg-amber-500' : uniq.size === 1 ? 'bg-emerald-500' : 'bg-slate-300')} />
            <span className="text-slate-600 w-32 shrink-0">{r.label}</span>

          </div>
        );
      })}
    </div>
  );
}
