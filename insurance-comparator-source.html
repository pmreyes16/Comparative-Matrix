/* ---------- best-fit (interactive weighted comparison) ---------- */
const BF_firstPct = (s) => { const m = String(s || '').match(/(\d+(?:\.\d+)?)\s*%/); return m ? parseFloat(m[1]) : null; };
const BF_firstAmt = (s) => { const m = String(s || '').replace(/,/g, '').match(/\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const BF_clausesText = (p) => (p.clausesAndWarranties || []).map((c, i) => (/^\s*\d+[.)]/.test(String(c)) ? String(c).trim() : (i + 1) + '. ' + String(c).trim())).join('\n');
// Effective value = the SAME thing shown in the Matrix (override-aware).
const BF_eff = (p, key, fb) => { const o = p.overrides && p.overrides[key]; return o != null && String(o).trim() !== '' ? String(o) : fb(p); };
const BF_clauseCount = (p) => { const t = BF_eff(p, 'clauses', (q) => BF_clausesText(q)); return t && t.trim() ? t.split('\n').filter((l) => l.trim()).length : 0; };
const BF_CRITERIA = [
  { key: 'premium', label: 'Total Premium', hint: 'lower is better', dir: 'lower', def: 70,
    disp: (p) => BF_eff(p, 'premiumTotal', (q) => (q.premium && q.premium.total ? CMP.formatMoney(q.premium.total.money) : '—')),
    num: (p) => BF_firstAmt(BF_eff(p, 'premiumTotal', (q) => (q.premium && q.premium.total ? CMP.formatMoney(q.premium.total.money) : ''))) },
  { key: 'premiumRate', label: 'Premium Rate', hint: 'lower is better', dir: 'lower', def: 50,
    disp: (p) => BF_eff(p, 'premiumRate', (q) => CMP.formatSections(q.premiumRate)) || '—',
    num: (p) => BF_firstPct(BF_eff(p, 'premiumRate', (q) => CMP.formatSections(q.premiumRate))) },
  { key: 'brokerage', label: 'Brokerage Rate', hint: 'lower is better', dir: 'lower', def: 30,
    disp: (p) => p.brokerageRate || '—',
    num: (p) => BF_firstPct(p.brokerageRate) },
  { key: 'clauses', label: 'Clauses & Warranties', hint: 'broader cover is better', dir: 'higher', def: 60,
    disp: (p) => BF_clauseCount(p) + ' captured',
    num: (p) => BF_clauseCount(p) },
  { key: 'sumInsured', label: 'Sum Insured', hint: 'higher is better', dir: 'higher', def: 40,
    disp: (p) => BF_eff(p, 'sumInsured', (q) => CMP.formatSections(q.sumInsured)) || '—',
    num: (p) => BF_firstAmt(BF_eff(p, 'sumInsured', (q) => CMP.formatSections(q.sumInsured))) },
  { key: 'deductibles', label: 'Deductibles', hint: 'lower is better', dir: 'lower', def: 40,
    disp: (p) => BF_eff(p, 'deductibles', (q) => CMP.formatSections(q.deductibles)) || '—',
    num: (p) => BF_firstPct(BF_eff(p, 'deductibles', (q) => CMP.formatSections(q.deductibles))) },
];
const BF_PRESETS = {
  Balanced: { premium: 70, premiumRate: 50, brokerage: 30, clauses: 60, sumInsured: 40, deductibles: 40 },
  'Lowest cost': { premium: 100, premiumRate: 80, brokerage: 60, clauses: 20, sumInsured: 20, deductibles: 60 },
  'Broadest cover': { premium: 30, premiumRate: 20, brokerage: 10, clauses: 100, sumInsured: 80, deductibles: 70 },
};
function bfScore(proposals, weights) {
  const active = BF_CRITERIA.filter((c) => weights[c.key] > 0);
  const per = active.map((c) => {
    const vals = proposals.map(c.num);
    const nums = vals.filter((v) => v != null && isFinite(v));
    return { c, vals, min: nums.length ? Math.min(...nums) : null, max: nums.length ? Math.max(...nums) : null };
  });
  const totalW = active.reduce((s, c) => s + weights[c.key], 0) || 1;
  return proposals.map((p, i) => {
    let sc = 0;
    per.forEach((pc) => {
      const v = pc.vals[i];
      let n = 0.5;
      if (v != null && isFinite(v) && pc.min != null) {
        n = pc.max === pc.min ? 0.5 : (v - pc.min) / (pc.max - pc.min);
        if (pc.c.dir === 'lower') n = 1 - n;
      }
      sc += n * weights[pc.c.key];
    });
    return { p, score: (sc / totalW) * 100 };
  }).sort((a, b) => b.score - a.score);
}
function BestFit({ proposals }) {
  const [weights, setWeights] = useState(() => { const o = {}; BF_CRITERIA.forEach((c) => { o[c.key] = c.def; }); return o; });
  const ranked = useMemo(() => bfScore(proposals, weights), [proposals, weights]);
  const max = Math.max(...ranked.map((r) => r.score), 0.0001);
  const best = ranked[0];
  const nm = (p) => (p.insurers[0] && p.insurers[0].name) || p.fileName;
  return (
    <div className="space-y-4">
      <div className="bg-white rounded-xl ring-1 ring-slate-200 p-4">
        <div className="flex items-start justify-between flex-wrap gap-3">
          <div>
            <div className="text-[11px] font-semibold uppercase tracking-[0.2em] text-[#0047AB]">Best Fit for Client</div>
            <h2 className="text-lg font-bold text-slate-800">Weigh what matters — see the best-fit insurer</h2>
          </div>
          <div className="flex gap-1.5">
            {Object.keys(BF_PRESETS).map((n) => (
              <button key={n} onClick={() => setWeights({ ...BF_PRESETS[n] })} className="text-xs rounded-md ring-1 ring-slate-200 px-2.5 py-1 hover:bg-slate-50 text-slate-600">{n}</button>
            ))}
          </div>
        </div>
        <div className="mt-4 grid gap-3 sm:grid-cols-2">
          {BF_CRITERIA.map((c) => (
            <div key={c.key} className="flex items-center gap-3">
              <div className="w-40 shrink-0">
                <div className="text-sm text-slate-700">{c.label}</div>
                <div className="text-[10px] text-slate-400">{c.dir === 'lower' ? '↓ ' : '↑ '}{c.hint}</div>
              </div>
              <input type="range" min="0" max="100" value={weights[c.key]} onChange={(e) => setWeights({ ...weights, [c.key]: Number(e.target.value) })} className="flex-1 accent-[#0047AB]" />
              <span className="w-8 text-right text-xs tnum text-slate-500">{weights[c.key]}</span>
            </div>
          ))}
        </div>
        <div className="mt-2 text-[11px] text-slate-400">Drag to set how important each factor is (0 = ignore). Automated decision aid — not a recommendation; always verify against the slips.</div>
      </div>

      {best && (
        <div className="rounded-xl ring-1 ring-teal-200 bg-teal-50 p-4 flex items-center justify-between gap-4">
          <div className="min-w-0">
            <div className="text-[11px] uppercase tracking-wide text-teal-600 font-semibold">Best fit on your current weighting</div>
            <div className="text-xl font-bold text-slate-800 truncate">{nm(best.p)}</div>
          </div>
          <div className="text-2xl font-bold text-teal-700 tnum shrink-0">{Math.round(best.score)}<span className="text-sm text-teal-500">/100</span></div>
        </div>
      )}

      <div className="bg-white rounded-xl ring-1 ring-slate-200 p-4">
        <div className="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-3">Fit ranking</div>
        <div className="space-y-2">
          {ranked.map((r, i) => (
            <div key={r.p.id} className="flex items-center gap-3">
              <span className="w-5 text-right text-xs text-slate-400 tnum">{i + 1}</span>
              <span className="w-44 truncate text-sm text-slate-700" title={nm(r.p)}>{nm(r.p)}</span>
              <div className="flex-1 bg-slate-100 rounded h-6 overflow-hidden">
                <div className={'h-6 rounded ' + (i === 0 ? 'bg-teal-600' : i === 1 ? 'bg-[#0047AB]' : 'bg-[#E63946]')} style={{ width: Math.max(4, (r.score / max) * 100) + '%' }} />
              </div>
              <span className="w-10 text-right text-sm tnum text-slate-700">{Math.round(r.score)}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="bg-white rounded-xl ring-1 ring-slate-200 overflow-auto cmp-scroll">
        <table className="min-w-full text-sm border-collapse">
          <thead>
            <tr className="bg-slate-50">
              <th className="text-left px-3 py-2 font-semibold text-slate-500 sticky left-0 bg-slate-50">Insurer</th>
              {BF_CRITERIA.map((c) => <th key={c.key} className="text-left px-3 py-2 font-semibold text-slate-500 min-w-[130px]">{c.label}</th>)}
            </tr>
          </thead>
          <tbody>
            {ranked.map((r, i) => (
              <tr key={r.p.id} className={'border-t border-slate-100 ' + (i === 0 ? 'bg-teal-50/40' : '')}>
                <td className="px-3 py-2 font-medium text-slate-700 sticky left-0 bg-white">{nm(r.p)}</td>
                {BF_CRITERIA.map((c) => <td key={c.key} className="px-3 py-2 text-slate-600 whitespace-pre-wrap break-words">{c.disp(r.p)}</td>)}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- main app ---------- */
/* ---- Archive page: saved comparative matrices (search / filter / sort) ---- */
function ArchiveView({ list, onView, onRestore, onDelete, onReload }) {
  const PAGE = 8;
  const fmtDate = (iso) => { try { return new Date(iso).toLocaleString(); } catch (e) { return iso || ''; } };
  const fileRef = useRef(null);
  const handleBackup = () => {
    const n = CMP.archiveExport();
    CMP.toast(n ? ('Backed up ' + n + ' comparison' + (n === 1 ? '' : 's') + ' to a file — keep it to restore later.') : 'Nothing to back up yet.');
  };
  const handleRestoreFile = async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if (!f) return;
    try {
      const text = await f.text();
      const res = CMP.archiveImport(text, 'merge');
      if (onReload) onReload();
      CMP.toast(res.added ? ('Restored ' + res.added + ' comparison' + (res.added === 1 ? '' : 's') + ' from your file.') : 'Those comparisons are already in your archive.');
    } catch (e) {
      CMP.toast(e.message || 'Could not read that backup file.');
    }
  };
  const [q, setQ] = useState('');
  const [policy, setPolicy] = useState('all');
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [sort, setSort] = useState('newest');
  const [page, setPage] = useState(1);
  const [confirm, setConfirm] = useState(null); // record pending delete

  const policyOpts = useMemo(() => CMP.archivePolicyTypes(list), [list]);

  const filtered = useMemo(() => {
    let rows = (list || []).slice();
    if (q.trim()) {
      const k = q.toLowerCase();
      rows = rows.filter((r) => (r.client_name || '').toLowerCase().includes(k) || (r.title || '').toLowerCase().includes(k));
    }
    if (policy !== 'all') rows = rows.filter((r) => r.policy_type === policy);
    if (from) { const t = new Date(from + 'T00:00:00').getTime(); rows = rows.filter((r) => new Date(r.saved_at).getTime() >= t); }
    if (to) { const t = new Date(to + 'T23:59:59').getTime(); rows = rows.filter((r) => new Date(r.saved_at).getTime() <= t); }
    const time = (r) => new Date(r.saved_at).getTime() || 0;
    if (sort === 'newest') rows.sort((a, b) => time(b) - time(a));
    else if (sort === 'oldest') rows.sort((a, b) => time(a) - time(b));
    else if (sort === 'client') rows.sort((a, b) => (a.client_name || '').localeCompare(b.client_name || ''));
    return rows;
  }, [list, q, policy, from, to, sort]);

  useEffect(() => { setPage(1); }, [q, policy, from, to, sort]);

  const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
  const clamped = Math.min(page, pages);
  const pageRows = filtered.slice((clamped - 1) * PAGE, clamped * PAGE);

  const doExport = (rec, kind) => {
    const m = CMP.buildMatrixFromProposals(rec.proposals || [], rec.baselineId || 'none');
    if (kind === 'xlsx') CMP.exportMatrixXlsx(m); else CMP.exportMatrixPdf(m);
  };

  const btn = 'text-[12px] rounded-md px-2.5 py-1 ring-1 transition-colors';

  return (
    <div className="bg-white rounded-2xl ring-1 ring-slate-200 shadow-sm overflow-hidden">
      {/* Title band */}
      <div className="bg-gradient-to-r from-[#211E24] to-[#141216] text-white px-5 py-4">
        <div className="text-[11px] font-semibold uppercase tracking-[0.2em] text-[#3F7FD6]">Archive</div>
        <div className="text-lg font-bold leading-tight mt-0.5">Saved comparative matrices</div>
        <div className="text-sm text-slate-300">{list.length} saved{list.length === 1 ? ' comparison' : ' comparisons'} on this device</div>
      </div>

      {/* Backup / restore + storage status */}
      <div className="flex flex-wrap items-center gap-2 px-5 py-2.5 bg-white border-b border-slate-200 text-[12px]">
        <button onClick={handleBackup} className={btn + ' ring-slate-200 text-slate-700 hover:bg-slate-100'}>⬇ Back up to file</button>
        <button onClick={() => fileRef.current && fileRef.current.click()} className={btn + ' ring-slate-200 text-slate-700 hover:bg-slate-100'}>⬆ Restore from file</button>
        <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={handleRestoreFile} />
        {CMP.storage.available
          ? <span className="ml-auto inline-flex items-center gap-1.5 text-emerald-600"><span>●</span> Saved in this browser — stays until you delete it</span>
          : <span className="ml-auto inline-flex items-center gap-1.5 text-amber-600"><span>●</span> This preview can’t save to your browser — use Back up / Restore, or open the file in a browser tab</span>}
      </div>

      {/* Filters */}
      <div className="flex flex-wrap items-center gap-3 px-5 py-3 bg-slate-50 border-b border-slate-200 text-[12px] text-slate-600">
        <input
          value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search client or title…"
          className="rounded-md ring-1 ring-slate-200 px-2.5 py-1.5 min-w-[200px]" />
        <label className="inline-flex items-center gap-1.5">Policy
          <select value={policy} onChange={(e) => setPolicy(e.target.value)} className="rounded-md ring-1 ring-slate-200 px-2 py-1.5">
            <option value="all">All</option>
            {policyOpts.map((p) => <option key={p} value={p}>{p}</option>)}
          </select>
        </label>
        <label className="inline-flex items-center gap-1.5">From
          <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} className="rounded-md ring-1 ring-slate-200 px-2 py-1.5" />
        </label>
        <label className="inline-flex items-center gap-1.5">To
          <input type="date" value={to} onChange={(e) => setTo(e.target.value)} className="rounded-md ring-1 ring-slate-200 px-2 py-1.5" />
        </label>
        <label className="inline-flex items-center gap-1.5 ml-auto">Sort
          <select value={sort} onChange={(e) => setSort(e.target.value)} className="rounded-md ring-1 ring-slate-200 px-2 py-1.5">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="client">Client A–Z</option>
          </select>
        </label>
      </div>

      {/* Empty states */}
      {list.length === 0 ? (
        <div className="text-center text-slate-400 py-16 px-6">
          <div className="text-4xl mb-3">🗄️</div>
          <p className="text-sm">No archived matrices yet. Save a comparative matrix to see it here.</p>
        </div>
      ) : filtered.length === 0 ? (
        <div className="text-center text-slate-400 py-16 px-6">
          <p className="text-sm">No matrices match your filters.</p>
        </div>
      ) : (
        <>
          <div className="overflow-auto">
            <table className="min-w-full text-[13px]">
              <thead>
                <tr className="text-left text-slate-500 border-b border-slate-200 bg-slate-50">
                  <th className="px-4 py-2.5 font-semibold">Title</th>
                  <th className="px-4 py-2.5 font-semibold">Client</th>
                  <th className="px-4 py-2.5 font-semibold">Policy type</th>
                  <th className="px-4 py-2.5 font-semibold">Saved</th>
                  <th className="px-4 py-2.5 font-semibold">By</th>
                  <th className="px-4 py-2.5 font-semibold text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                {pageRows.map((r) => (
                  <tr key={r.id} className="border-b border-slate-100 hover:bg-slate-50/60 align-top">
                    <td className="px-4 py-2.5 font-medium text-slate-800 max-w-[260px]">{r.title}</td>
                    <td className="px-4 py-2.5 text-slate-600 max-w-[200px]">{r.client_name}</td>
                    <td className="px-4 py-2.5 text-slate-600">{r.policy_type || <span className="text-slate-300">—</span>}</td>
                    <td className="px-4 py-2.5 text-slate-500 whitespace-nowrap">{fmtDate(r.saved_at)}</td>
                    <td className="px-4 py-2.5 text-slate-500">{r.saved_by}</td>
                    <td className="px-4 py-2.5">
                      <div className="flex flex-wrap gap-1.5 justify-end">
                        <button onClick={() => onView(r)} className={btn + ' ring-slate-200 text-slate-700 hover:bg-slate-100'}>View</button>
                        <button onClick={() => onRestore(r)} className={btn + ' ring-[#BCD6F2] text-[#00337A] hover:bg-[#E9F1FB]'}>Restore</button>
                        <button onClick={() => doExport(r, 'xlsx')} className={btn + ' ring-slate-200 text-slate-700 hover:bg-slate-100'}>Excel</button>
                        <button onClick={() => doExport(r, 'pdf')} className={btn + ' ring-slate-200 text-slate-700 hover:bg-slate-100'}>PDF</button>
                        <button onClick={() => setConfirm(r)} className={btn + ' ring-red-200 text-red-600 hover:bg-red-50'}>Delete</button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Pagination */}
          {pages > 1 && (
            <div className="flex items-center justify-between px-5 py-3 text-[12px] text-slate-500 border-t border-slate-200">
              <span>Showing {(clamped - 1) * PAGE + 1}–{Math.min(clamped * PAGE, filtered.length)} of {filtered.length}</span>
              <div className="flex items-center gap-2">
                <button onClick={() => setPage((p) => Math.max(1, p - 1))} disabled={clamped <= 1}
                  className="rounded-md ring-1 ring-slate-200 px-2.5 py-1 disabled:opacity-40 hover:bg-slate-50">Prev</button>
                <span>Page {clamped} / {pages}</span>
                <button onClick={() => setPage((p) => Math.min(pages, p + 1))} disabled={clamped >= pages}
                  className="rounded-md ring-1 ring-slate-200 px-2.5 py-1 disabled:opacity-40 hover:bg-slate-50">Next</button>
              </div>
            </div>
          )}
        </>
      )}

      {/* Delete confirmation */}
      {confirm && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4" onClick={() => setConfirm(null)}>
          <div className="bg-white rounded-xl shadow-xl ring-1 ring-slate-200 max-w-sm w-full p-5" onClick={(e) => e.stopPropagation()}>
            <div className="text-base font-semibold text-slate-800 mb-1">Delete this archived matrix?</div>
            <p className="text-sm text-slate-500 mb-4">“{confirm.title}” will be permanently removed from the Archive on this device. This can’t be undone.</p>
            <div className="flex justify-end gap-2">
              <button onClick={() => setConfirm(null)} className="text-sm rounded-md ring-1 ring-slate-200 px-3 py-1.5 hover:bg-slate-50 text-slate-700">Cancel</button>
              <button onClick={() => { onDelete(confirm); setConfirm(null); }} className="text-sm rounded-md bg-red-600 hover:bg-red-700 text-white px-3 py-1.5">Delete</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const [files, setFiles] = useState([]);        // {id,name,status,insurer,error}
  const [proposals, setProposals] = useState([]); // extracted proposal objects (id === file id)
  const [view, setView] = useState('overview');
  const [baselineId, setBaselineId] = useState('none');
  const [sortKey, setSortKey] = useState('none');
  const [policyFilter, setPolicyFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [onlyDiff, setOnlyDiff] = useState(false);
  const [premiumMax, setPremiumMax] = useState(null); // slider upper bound
  const [clauseKeyword, setClauseKeyword] = useState('');
  const [archiveList, setArchiveList] = useState([]);   // saved matrices (localStorage)
  const [archiveItem, setArchiveItem] = useState(null); // record being viewed read-only
  const [justSaved, setJustSaved] = useState(null);     // last saved record → confirmation banner
  const dropRef = useRef();

  const addFiles = useCallback(async (fileList) => {
    const arr = [...fileList];
    for (const file of arr) {
      const id = 'f_' + Math.random().toString(36).slice(2, 9);
      setFiles((prev) => [...prev, { id, name: file.name, status: 'processing', insurer: '' }]);
      try {
        const parsed = await CMP.parseFile(file);
        let prop;
        if (CMP.AI_ENDPOINT) {
          try { prop = await CMP.extractWithAI(parsed, file.name); }
          catch (e) { prop = CMP.extract(parsed, file.name); }
        } else {
          prop = CMP.extract(parsed, file.name);
        }
        prop.id = id;
        const insurerName = (prop.insurers[0] && prop.insurers[0].name) || '';
        const status = (prop.extractionConfidence === 'low' || prop.flaggedFields.length) ? 'review' : 'parsed';
        setProposals((prev) => [...prev, prop]);
        setFiles((prev) => prev.map((f) => f.id === id ? { ...f, status, insurer: insurerName } : f));
      } catch (err) {
        setFiles((prev) => prev.map((f) => f.id === id ? { ...f, status: 'error', error: String(err.message || err) } : f));
      }
    }
  }, []);

  const removeFile = useCallback((id) => {
    setFiles((prev) => prev.filter((f) => f.id !== id));
    setProposals((prev) => prev.filter((p) => p.id !== id));
  }, []);

  const assignLogo = useCallback((propId, dataUrl) => {
    setProposals((prev) => prev.map((p) => {
      if (p.id !== propId) return p;
      const insurers = p.insurers.length ? p.insurers.slice() : [{ name: p.fileName, percentageShare: '', logoUrl: '' }];
      insurers[0] = { ...insurers[0], logoUrl: dataUrl };
      return { ...p, insurers };
    }));
  }, []);

  // Apply a manual edit (typed figure) to one proposal; Matrix/Overview recompute.
  const editProposal = useCallback((id, updater) => {
    setProposals((prev) => prev.map((p) => (p.id === id ? updater(p) : p)));
  }, []);

  // Edit any Matrix cell → update the proposal's field (direct) or a display override.
  const editMatrixCell = useCallback((id, key, text) => {
    if (!key) return;
    // Auto-format money cells: single-amount cells (Total Premium, Premium
    // Charges) get a full ₱ + comma + cents; mixed cells (Sum Insured,
    // Deductibles) only reformat the amounts inside their text.
    const wholeMoney = key === 'premiumTotal' || key.indexOf('premium:') === 0;
    const inTextMoney = key === 'sumInsured' || key === 'deductibles';
    const val = wholeMoney ? CMP.formatMoneyInput(text) : inTextMoney ? CMP.formatMoneyInText(text) : text;
    editProposal(id, (p) => {
      if (DIRECT_FIELDS.has(key)) return { ...p, [key]: val };
      const overrides = { ...(p.overrides || {}) };
      if (val && val.trim()) overrides[key] = val; else delete overrides[key];
      return { ...p, overrides };
    });
  }, [editProposal]);

  // ---- Save / open the whole comparison (matrix + all manual edits) ----
  const restoreSnapshot = useCallback((d) => {
    if (!d || !Array.isArray(d.proposals)) { alert('That file is not a saved CRS comparison.'); return false; }
    setProposals(d.proposals);
    setBaselineId(d.baselineId || 'none');
    setFiles(d.proposals.map((p) => ({ id: p.id, name: p.fileName || 'Restored proposal', status: (p.extractionConfidence === 'low' || (p.flaggedFields && p.flaggedFields.length)) ? 'review' : 'parsed', insurer: (p.insurers[0] && p.insurers[0].name) || '' })));
    return true;
  }, []);

  // "Save" archives the current comparison to the browser (localStorage) and
  // shows a confirmation banner. Returns the created record; throws if there's
  // nothing to save (MatrixView's run() catches and shows an error toast).
  const saveComparison = useCallback(() => {
    const name = CMP.comparisonExport(proposals, baselineId); // download the file — durable & portable
    let rec = null;
    // Also keep an in-browser Archive entry (persists in a real browser tab; harmless if storage is blocked).
    try { rec = CMP.archiveSave(proposals, baselineId); setArchiveList(CMP.archiveLoad()); } catch (e) {}
    setJustSaved({ name: name, title: (rec && rec.title) || name, archived: !!(rec && CMP.storage.available) });
    return { name: name, rec: rec };
  }, [proposals, baselineId]);

  const restoreFromArchive = useCallback((rec) => {
    restoreSnapshot({ proposals: rec.proposals, baselineId: rec.baselineId });
    setView('matrix');
    setJustSaved(null);
    CMP.toast('Restored “' + (rec.title || 'comparison') + '” — you can edit and re-save.');
  }, [restoreSnapshot]);

  const deleteArchive = useCallback((rec) => {
    setArchiveList(CMP.archiveDelete(rec.id));
    setArchiveItem((cur) => (cur && cur.id === rec.id ? null : cur));
  }, []);

  const openComparison = useCallback((file) => {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const ok = restoreSnapshot(JSON.parse(rd.result));
        if (ok) { setRestorable(null); setView('overview'); CMP.toast('Opened your comparison — pick up where you left off.'); }
      } catch (e) { alert('Could not read that file — is it a saved comparison (.json)?'); }
    };
    rd.readAsText(file);
  }, [restoreSnapshot]);

  useEffect(() => {
    try { if (proposals.length) CMP.storage.set('crs-comparison', JSON.stringify({ version: 1, savedAt: new Date().toISOString(), baselineId, proposals })); } catch (e) {}
  }, [proposals, baselineId]);

  const [restorable, setRestorable] = useState(null);
  useEffect(() => {
    try { const raw = CMP.storage.get('crs-comparison'); if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.proposals) && d.proposals.length) setRestorable(d); } } catch (e) {}
  }, []);

  // Load the saved-matrix archive once on mount.
  useEffect(() => { setArchiveList(CMP.archiveLoad()); }, []);

  const onDrop = (e) => { e.preventDefault(); dropRef.current && dropRef.current.classList.remove('ring-sky-400'); if (e.dataTransfer.files) addFiles(e.dataTransfer.files); };

  /* ---- derived: policy types, premium bounds ---- */
  const policyTypes = useMemo(() => [...new Set(proposals.map((p) => p.policyType).filter(Boolean))], [proposals]);
  const premiumBounds = useMemo(() => {
    const amts = proposals.map((p) => CMP.premiumTotalAmount(p)).filter((n) => n != null);
    if (!amts.length) return null;
    return { min: Math.min(...amts), max: Math.max(...amts) };
  }, [proposals]);

  /* ---- filtering + sorting ---- */
  const shown = useMemo(() => {
    let list = proposals.slice();
    if (policyFilter !== 'all') list = list.filter((p) => p.policyType === policyFilter);
    if (clauseKeyword.trim()) {
      const k = clauseKeyword.toLowerCase();
      list = list.filter((p) => p.clausesAndWarranties.join(' ').toLowerCase().includes(k) || (p.cover || '').toLowerCase().includes(k));
    }
    if (search.trim()) {
      const k = search.toLowerCase();
      list = list.filter((p) => (p.rawText || '').toLowerCase().includes(k) ||
        JSON.stringify(p).toLowerCase().includes(k));
    }
    if (premiumMax != null) {
      list = list.filter((p) => { const a = CMP.premiumTotalAmount(p); return a == null ? true : a <= premiumMax; });
    }
    const amt = (p) => { const a = CMP.premiumTotalAmount(p); return a == null ? Infinity : a; };
    const si = (p) => { const a = CMP.primaryAmount(p.sumInsured); return a == null ? -Infinity : a; };
    if (sortKey === 'premiumAsc') list.sort((a, b) => amt(a) - amt(b));
    else if (sortKey === 'premiumDesc') list.sort((a, b) => amt(b) - amt(a));
    else if (sortKey === 'sumDesc') list.sort((a, b) => si(b) - si(a));
    else if (sortKey === 'name') list.sort((a, b) => ((a.insurers[0]||{}).name || a.fileName).localeCompare((b.insurers[0]||{}).name || b.fileName));
    return list;
  }, [proposals, policyFilter, clauseKeyword, search, premiumMax, sortKey]);

  /* ---- auto badges (computed over the currently shown set) ---- */
  const badgeMap = useMemo(() => {
    const map = {};
    const withPrem = shown.map((p) => ({ p, a: CMP.premiumTotalAmount(p) })).filter((x) => x.a != null);
    if (withPrem.length > 1) {
      const cheapest = withPrem.reduce((a, b) => (a.a <= b.a ? a : b));
      map[cheapest.p.id] = { ...(map[cheapest.p.id] || {}), bestPrice: true };
    }
    if (shown.length > 1) {
      const broadest = shown.reduce((a, b) => {
        const av = a.clausesAndWarranties.length + (a.cover ? a.cover.length / 200 : 0);
        const bv = b.clausesAndWarranties.length + (b.cover ? b.cover.length / 200 : 0);
        return av >= bv ? a : b;
      });
      map[broadest.id] = { ...(map[broadest.id] || {}), mostCoverage: true };
    }
    return map;
  }, [shown]);

  const errorFiles = files.filter((f) => f.status === 'error');
  const hasData = proposals.length > 0;
  const isArchive = view === 'archive' || view === 'archiveItem';
  const baselineSelect = (
    <label className="inline-flex items-center gap-1.5 text-slate-500">
      Benchmark against:
      <select value={baselineId} onChange={(e) => setBaselineId(e.target.value)} className="text-[12px] rounded-md ring-1 ring-slate-200 px-2 py-1">
        <option value="none">No baseline (show all values)</option>
        {shown.map((p) => <option key={p.id} value={p.id}>{(p.insurers[0] && p.insurers[0].name) || p.fileName}</option>)}
      </select>
    </label>
  );

  return (
    <div className="max-w-[95rem] mx-auto px-4 py-6">
      {/* header */}
      <header className="flex items-center justify-between mb-5 gap-4">
        <div className="flex items-center gap-3">
          <img src={HOWDEN_LOGO} alt="Howden" className="h-6 w-auto shrink-0" />
          <div className="border-l border-slate-200 pl-3">
            <div className="text-2xl font-bold uppercase tracking-wide text-[#0047AB]">HowdenPH-Apps</div>
            <h1 className="text-xl font-bold text-slate-800">CRS Comparative Analysis</h1>
            <p className="text-sm text-slate-500">Upload quotation slips from multiple insurers — compare premiums, cover and terms side by side.</p>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {hasData && !isArchive && (
            <div className="inline-flex rounded-lg ring-1 ring-slate-200 bg-white overflow-hidden text-sm">
              <button className={'px-3 py-1.5 ' + (view === 'overview' ? 'bg-slate-800 text-white' : 'text-slate-600')} onClick={() => setView('overview')}>Overview</button>
              <button className={'px-3 py-1.5 ' + (view === 'bestfit' ? 'bg-slate-800 text-white' : 'text-slate-600')} onClick={() => setView('bestfit')}>Best Fit</button>
              <button className={'px-3 py-1.5 ' + (view === 'matrix' ? 'bg-slate-800 text-white' : 'text-slate-600')} onClick={() => setView('matrix')}>Matrix</button>
            </div>
          )}
          {isArchive && (
            <button
              onClick={() => setView(hasData ? 'matrix' : 'overview')}
              className="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm ring-1 bg-white text-slate-600 ring-slate-200 hover:bg-slate-50">
              ← Back
            </button>
          )}
        </div>
      </header>

      {isArchive ? (
        view === 'archiveItem' && archiveItem ? (
          <>
            <div className="mb-3 flex items-center gap-3">
              <button onClick={() => setView('archive')} className="text-sm text-[#00337A] hover:underline">← Back to Archive</button>
              <span className="text-sm text-slate-500">Viewing a saved matrix (read-only)</span>
            </div>
            <MatrixView matrix={CMP.buildMatrixFromProposals(archiveItem.proposals || [], archiveItem.baselineId || 'none')} />
          </>
        ) : (
          <ArchiveView
            list={archiveList}
            onView={(rec) => { setArchiveItem(rec); setView('archiveItem'); }}
            onRestore={restoreFromArchive}
            onDelete={deleteArchive}
            onReload={() => setArchiveList(CMP.archiveLoad())}
          />
        )
      ) : (
        <>

      {/* upload zone */}
      <div
        ref={dropRef}
        onDragOver={(e) => { e.preventDefault(); dropRef.current.classList.add('ring-sky-400'); }}
        onDragLeave={() => dropRef.current.classList.remove('ring-sky-400')}
        onDrop={onDrop}
        className="rounded-xl border-2 border-dashed border-slate-300 ring-0 bg-white/60 p-6 text-center transition mb-4"
      >
        <p className="text-slate-600 text-sm">Drag & drop proposal files here, or</p>
        <label className="inline-block mt-2 cursor-pointer rounded-lg bg-sky-600 text-white px-4 py-2 text-sm font-medium hover:bg-sky-700">
          Choose files
          <input type="file" multiple accept=".pdf,.xlsx,.xls,.docx" className="hidden"
            onChange={(e) => { addFiles(e.target.files); e.target.value = ''; }} />
        </label>
        <label className="inline-block mt-2 ml-2 cursor-pointer rounded-lg bg-white text-slate-700 px-4 py-2 text-sm font-medium ring-1 ring-slate-300 hover:bg-slate-50">
          Open saved comparison
          <input type="file" accept="application/json,.json" className="hidden"
            onChange={(e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) openComparison(f); }} />
        </label>
        <p className="mt-2 text-[11px] text-slate-400">Upload PDF, Excel (.xlsx/.xls) or Word (.docx) slips — or reopen a comparison you saved earlier (.json). Everything stays in your browser; nothing is uploaded to a server.</p>
      </div>

      {/* restore saved comparison */}
      {restorable && !hasData && files.length === 0 && (
        <div className="mb-4 flex items-center justify-between gap-3 rounded-lg bg-[#0047AB]/5 ring-1 ring-[#0047AB]/25 px-3 py-2 text-sm text-slate-700">
          <span>You have a saved comparison — <strong>{restorable.proposals.length}</strong> proposal{restorable.proposals.length !== 1 ? 's' : ''}{restorable.savedAt ? ', saved ' + new Date(restorable.savedAt).toLocaleString() : ''}.</span>
          <span className="flex gap-3 shrink-0">
            <button className="text-[#0047AB] font-medium hover:underline" onClick={() => { restoreSnapshot(restorable); setRestorable(null); }}>Restore</button>
            <button className="text-slate-400 hover:underline" onClick={() => setRestorable(null)}>Dismiss</button>
          </span>
        </div>
      )}

      {/* file chips */}
      {files.length > 0 && (
        <div className="flex flex-wrap gap-2 mb-4">
          {files.map((f) => <FileChip key={f.id} f={f} onRemove={removeFile} />)}
        </div>
      )}

      {/* per-file errors (do not block the rest) */}
      {errorFiles.length > 0 && (
        <div className="mb-4 rounded-lg bg-red-50 ring-1 ring-red-200 p-3">
          <div className="text-sm font-medium text-red-800 mb-1">Some files couldn't be read</div>
          <ul className="text-sm text-red-700 list-disc list-inside">
            {errorFiles.map((f) => <li key={f.id}>{f.name} — {f.error || 'could not be parsed (it may be corrupted, password-protected, or an unsupported format).'}</li>)}
          </ul>
        </div>
      )}

      {/* saved-to-archive confirmation */}
      {justSaved && (
        <div className="mb-4 flex items-center justify-between gap-3 rounded-lg bg-[#E9F1FB] ring-1 ring-[#BCD6F2] px-3 py-2 text-sm text-[#0A2E63]">
          <span>Saved ✓ — downloaded <strong>{justSaved.name}</strong>. Next time, use <strong>Open</strong> on the start screen to pick up where you left off.{justSaved.archived && <span className="text-[#0A2E63]/70"> Also kept in this browser’s Archive.</span>}</span>
          <span className="flex gap-3 shrink-0">
            {justSaved.archived && <button className="text-[#00337A] font-medium hover:underline" onClick={() => setView('archive')}>View in Archive</button>}
            <button className="text-slate-400 hover:underline" onClick={() => setJustSaved(null)}>Dismiss</button>
          </span>
        </div>
      )}

      {/* empty state */}
      {!hasData && files.length === 0 && (
        <div className="text-center text-slate-400 py-16">
          <div className="text-5xl mb-3">📄⚖️📄</div>
          <p className="text-sm">No proposals yet. Upload two or more quotation slips to start comparing.</p>
        </div>
      )}

      {/* controls + results */}
      {hasData && (
        <>
          <div className="bg-white rounded-xl ring-1 ring-slate-200 p-3 mb-4 flex flex-wrap items-center gap-3">
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-500">Sort</span>
              <select value={sortKey} onChange={(e) => setSortKey(e.target.value)} className="text-sm rounded-md ring-1 ring-slate-200 px-2 py-1">
                <option value="none">—</option>
                <option value="premiumAsc">Total premium (low → high)</option>
                <option value="premiumDesc">Total premium (high → low)</option>
                <option value="sumDesc">Sum insured (high → low)</option>
                <option value="name">Insurer name (A → Z)</option>
              </select>
            </div>

            {policyTypes.length > 0 && (
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-500">Policy type</span>
                <select value={policyFilter} onChange={(e) => setPolicyFilter(e.target.value)} className="text-sm rounded-md ring-1 ring-slate-200 px-2 py-1">
                  <option value="all">All</option>
                  {policyTypes.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            )}

            {premiumBounds && (
              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-500">Max premium</span>
                <input type="range" min={premiumBounds.min} max={premiumBounds.max}
                  value={premiumMax == null ? premiumBounds.max : premiumMax}
                  onChange={(e) => setPremiumMax(Number(e.target.value))}
                  className="w-40" />
                <span className="text-xs mono-amt tnum text-slate-600">≤ {(premiumMax == null ? premiumBounds.max : premiumMax).toLocaleString()}</span>
                {premiumMax != null && <button className="text-[11px] text-sky-600 hover:underline" onClick={() => setPremiumMax(null)}>reset</button>}
              </div>
            )}

            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-500">Clause/add-on</span>
              <input value={clauseKeyword} onChange={(e) => setClauseKeyword(e.target.value)} placeholder="e.g. acts of nature"
                className="text-sm rounded-md ring-1 ring-slate-200 px-2 py-1 w-40" />
            </div>

            <div className="flex items-center gap-2 flex-1 min-w-[180px]">
              <span className="text-xs text-slate-500">Search</span>
              <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="keyword across all slips…"
                className="text-sm rounded-md ring-1 ring-slate-200 px-2 py-1 flex-1" />
            </div>

            {view === 'table' && (
              <label className="flex items-center gap-1.5 text-xs text-slate-600">
                <input type="checkbox" checked={onlyDiff} onChange={(e) => setOnlyDiff(e.target.checked)} />
                Show only differences
              </label>
            )}
          </div>

          {shown.length === 0 ? (
            <div className="text-center text-slate-400 py-12 text-sm">No proposals match the current filters.</div>
          ) : view === 'overview' ? (
            <Overview proposals={shown} onView={setView} />
          ) : view === 'bestfit' ? (
            <BestFit proposals={shown} />
          ) : (
            <MatrixView matrix={CMP.buildMatrixFromProposals(shown, baselineId)} controls={baselineSelect} onEdit={editMatrixCell} onSave={saveComparison} onArchive={() => setView('archive')} />
          )}
        </>
      )}

        </>
      )}

      {/* footer disclaimer */}
      <footer className="mt-8 border-t border-slate-200 pt-4 text-[12px] text-slate-500">
        Auto-extracted for comparison purposes. Figures are copied verbatim from each slip and may be incomplete or mis-read —
        <strong> always verify figures against the original quotation slip before making a decision.</strong>
        <span className="block mt-1 text-slate-400">Heuristic extraction is on by default; fields recovered from loose text are marked “Needs review”. See the AI-extraction hook in the source to wire in an AI parser.</span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
